<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ledger">
<meta name="theme-color" content="#0F0D14">
<title>Ledger — Training Log</title>
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%230F0D14'/%3E%3Ccircle cx='50' cy='50' r='26' fill='none' stroke='%238B7CF6' stroke-width='5'/%3E%3Ccircle cx='50' cy='50' r='6' fill='%238B7CF6'/%3E%3C/svg%3E">
<style>
  :root{
    --bg:#0F0D14; --surface:#17141F; --surface-2:#1E1A29; --line:#2A2436;
    --text:#EDEAF5; --muted:#8C859C; --accent:#9A8CFB; --accent-dim:#5F52A8;
    --accent-rgb:154,140,251; --accent-glow:rgba(154,140,251,.35); --danger:#D97C6B; --radius:12px;
    --mono: ui-monospace, "SF Mono", "Menlo", "Consolas", monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    margin:0; overflow:hidden;
    background:
      radial-gradient(ellipse 900px 520px at 15% -8%, rgba(var(--accent-rgb),.16), transparent 60%),
      radial-gradient(ellipse 700px 460px at 105% 6%, rgba(var(--accent-rgb),.10), transparent 55%),
      radial-gradient(ellipse 600px 500px at 50% 110%, rgba(var(--accent-rgb),.09), transparent 60%),
      var(--bg);
    color:var(--text); font-family:var(--sans); -webkit-font-smoothing:antialiased;
  }
  canvas#fx{position:fixed; inset:0; z-index:0; pointer-events:none;}
  #page{position:relative; z-index:1; height:100vh; height:100dvh; display:flex; flex-direction:column;}
  #scroll-area{flex:1; min-height:0; overflow-y:auto; -webkit-overflow-scrolling:touch; overscroll-behavior-y:contain; max-width:560px; margin:0 auto; width:100%; padding:0 16px; box-sizing:border-box;}

  header.top{padding:calc(18px + env(safe-area-inset-top)) 0 16px; display:flex; align-items:center; justify-content:space-between;}
  header.top .brand{font-family:var(--mono); font-size:12.5px; letter-spacing:.22em; color:var(--accent); text-transform:uppercase;}
  header.top .head-right{display:flex; align-items:center; gap:12px;}
  header.top .date{font-family:var(--mono); font-size:11px; color:var(--muted);}
  .icon-btn{background:none; border:none; color:var(--muted); padding:2px; display:flex; transition:transform .15s ease, color .15s ease;}
  .icon-btn:active{transform:scale(.88); color:var(--accent);}
  .icon-btn svg{width:19px; height:19px;}

  h1{font-size:23px; font-weight:650; margin:14px 0 4px; letter-spacing:-.01em;}
  h2{font-size:14.5px; font-weight:600; margin:0 0 10px; letter-spacing:-.005em;}
  .eyebrow{font-family:var(--mono); font-size:10.5px; letter-spacing:.16em; color:var(--accent); text-transform:uppercase; opacity:.8;}
  .sub{color:var(--muted); font-size:13px; margin:0 0 18px;}

  .screen{animation:screenIn .28s cubic-bezier(.2,.8,.3,1); padding-bottom:24px;}
  @keyframes screenIn{from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:translateY(0);}}

  nav.tabs{
    flex-shrink:0; position:relative;
    background:rgba(15,13,20,.82); backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px);
    box-shadow: 0 -18px 30px -18px rgba(0,0,0,.7);
    display:flex; max-width:560px; margin:0 auto; width:100%;
    padding:6px 8px calc(6px + env(safe-area-inset-bottom)); z-index:50;
  }
  nav.tabs .nav-pill{position:absolute; top:6px; bottom:calc(6px + env(safe-area-inset-bottom)); left:8px; width:calc(25% - 4px); background:rgba(var(--accent-rgb),.12); border-radius:14px; transition:transform .28s cubic-bezier(.2,.8,.3,1); z-index:0;}
  nav.tabs button{
    position:relative; z-index:1; flex:1; background:none; border:none; color:var(--muted);
    font-family:var(--mono); font-size:9.5px; letter-spacing:.06em; text-transform:uppercase;
    padding:8px 4px 6px; display:flex; flex-direction:column; align-items:center; gap:3px;
    transition:transform .12s ease, color .15s ease;
  }
  nav.tabs button:active{transform:scale(.92);}
  nav.tabs button svg{width:20px; height:20px; opacity:.75; transition:opacity .15s ease;}
  nav.tabs button.active{color:var(--text);}
  nav.tabs button.active svg{opacity:1; color:var(--accent);}

  .card{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:15px 16px; margin-bottom:10px; transition:transform .12s ease;}
  .card.tap:active{transform:scale(.985);}
  .row{display:flex; align-items:center; justify-content:space-between; gap:10px;}
  .stat-grid{display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:16px;}
  .stat{border:1px solid var(--line); padding:13px 10px; border-radius:var(--radius); background:var(--surface);}
  .stat .num{font-family:var(--mono); font-size:19px; color:var(--accent);}
  .stat .lbl{font-family:var(--mono); font-size:9px; color:var(--muted); letter-spacing:.08em; text-transform:uppercase; margin-top:3px;}

  button{font-family:var(--sans); cursor:pointer;}
  .btn{background:var(--surface-2); color:var(--text); border:1px solid var(--line); border-radius:10px; padding:11px 14px; font-size:14px; font-weight:500; display:inline-flex; align-items:center; justify-content:center; gap:6px; transition:transform .1s ease, background .12s ease;}
  .btn:active{background:var(--line); transform:scale(.97);}
  .btn.primary{background:var(--accent); color:#15111F; border-color:var(--accent); font-weight:600; box-shadow:0 4px 20px var(--accent-glow);}
  .btn.primary:active{background:var(--accent-dim);}
  .btn.danger{color:var(--danger); border-color:rgba(217,124,107,.4);}
  .btn.ghost{background:none; border:none; color:var(--muted); padding:6px 4px;}
  .btn.block{width:100%;}
  .btn.sm{padding:7px 10px; font-size:12.5px;}

  input, select, textarea{width:100%; background:var(--surface-2); border:1px solid var(--line); color:var(--text); border-radius:9px; padding:10px 11px; font-size:15px; font-family:var(--sans);}
  input:focus, select:focus, textarea:focus{outline:none; border-color:var(--accent);}
  input[type=number]{font-family:var(--mono);}
  input::placeholder{color:#5B5468;}

  .exercise-block{border:1px solid var(--line); border-radius:var(--radius); margin-bottom:12px; overflow:hidden; background:var(--surface);}
  .exercise-block .ex-head{padding:13px 14px; background:var(--surface-2); display:flex; justify-content:space-between; align-items:center; gap:8px;}
  .exercise-block .ex-head .name{font-weight:600; font-size:14.5px;}
  .exercise-block .ex-head .target{font-family:var(--mono); font-size:11px; color:var(--muted);}
  .copy-last{font-family:var(--mono); font-size:10px; letter-spacing:.03em; color:var(--accent); background:none; border:1px solid var(--accent-dim); border-radius:14px; padding:5px 9px; flex-shrink:0; white-space:nowrap; transition:transform .1s ease;}
  .copy-last:active{transform:scale(.94);}
  .set-row{position:relative; display:grid; grid-template-columns:22px 1fr 1fr 30px; gap:8px; align-items:center; padding:9px 14px;}
  .set-row .idx{font-family:var(--mono); color:var(--muted); font-size:12px;}
  .set-row input{padding:8px 9px; font-size:14px; text-align:center;}
  .set-row .done-btn{width:30px; height:30px; border-radius:50%; border:1px solid var(--line); background:var(--surface-2); color:var(--muted); font-size:14px; display:flex; align-items:center; justify-content:center; transition:transform .15s cubic-bezier(.34,1.56,.64,1), background .15s ease;}
  .set-row.logged .done-btn{background:var(--accent); border-color:var(--accent); color:#15111F; box-shadow:0 0 10px var(--accent-glow); transform:scale(1.05);}
  .set-row.logged input{border-color:var(--accent-dim);}
  .set-row .pr-tag{position:absolute; left:36px; top:1px; font-family:var(--mono); font-size:8px; color:#15111F; background:var(--accent); padding:1px 5px; border-radius:5px; letter-spacing:.03em;}
  .pace-note{padding:0 14px 8px; font-family:var(--mono); font-size:11px; color:var(--accent); opacity:.85;}
  .add-set{padding:10px 14px 12px; font-family:var(--mono); font-size:11.5px; color:var(--accent); text-transform:uppercase; letter-spacing:.06em;}
  .elapsed{font-family:var(--mono); font-size:12px; color:var(--accent);}

  .day-block{border:1px solid var(--line); border-radius:var(--radius); margin-bottom:10px; background:var(--surface); overflow:hidden;}
  .day-head{padding:11px 14px; background:var(--surface-2); display:flex; justify-content:space-between; align-items:center;}
  .ex-line{display:grid; grid-template-columns:1fr 44px 44px 34px 22px; gap:6px; padding:9px 14px; align-items:center;}
  .ex-line input{padding:7px 8px; font-size:13px;}
  .ex-line .type-chip{font-family:var(--mono); font-size:9.5px; text-align:center; padding:7px 2px; border-radius:7px; border:1px solid var(--line); color:var(--muted); text-transform:uppercase;}
  .ex-line .type-chip.cardio{color:var(--accent); border-color:var(--accent-dim);}
  .ex-line .rm{color:var(--muted); font-size:16px; text-align:center;}

  .empty{text-align:center; padding:54px 20px; color:var(--muted);}
  .empty .mark{width:36px; height:36px; margin:0 auto 14px; border-radius:50%; border:1px solid var(--accent-dim); box-shadow:0 0 22px var(--accent-glow); opacity:.7;}
  .empty p{font-size:13.5px; line-height:1.55; max-width:280px; margin:0 auto;}
  .empty-inline{color:var(--muted); font-size:12.5px; padding:8px 0;}

  .ex-select{margin-bottom:14px;}
  .pr-badge{font-family:var(--mono); font-size:10px; color:var(--accent); border:1px solid var(--accent-dim); padding:3px 7px; border-radius:20px; white-space:nowrap;}
  .lib-grid{display:flex; flex-wrap:wrap; gap:6px; margin-bottom:4px;}
  .lib-chip{font-family:var(--sans); font-size:12.5px; padding:8px 12px; border-radius:16px; border:1px solid var(--line); background:var(--surface-2); color:var(--text); transition:transform .1s ease;}
  .lib-chip:active{transform:scale(.94);}
  .lib-chip.added{color:var(--accent); border-color:var(--accent-dim); opacity:.75;}
  .hist-row{display:flex; justify-content:space-between; padding:9px 0; font-size:13.5px;}
  .hist-row .d{color:var(--muted); font-family:var(--mono); font-size:11.5px;}
  svg.chart{width:100%; height:140px; display:block;}

  /* Home */
  .greeting-sub{color:var(--muted); font-size:13.5px; margin:-2px 0 18px;}
  .resume-card{border:1px solid var(--accent-dim); background:linear-gradient(135deg, rgba(var(--accent-rgb),.14), var(--surface)); border-radius:var(--radius); padding:14px 16px; margin-bottom:16px; animation:resumePulse 2.4s ease-in-out infinite;}
  @keyframes resumePulse{0%,100%{box-shadow:0 0 0 rgba(var(--accent-rgb),0);} 50%{box-shadow:0 0 18px rgba(var(--accent-rgb),.18);}}
  .week-ring{display:flex; justify-content:space-between; margin-bottom:18px;}
  .ring-day{width:34px; height:34px; border-radius:50%; border:1px solid var(--line); display:flex; align-items:center; justify-content:center; font-family:var(--mono); font-size:10.5px; color:var(--muted); position:relative;}
  .ring-day.trained{background:var(--accent); border-color:var(--accent); color:#15111F; box-shadow:0 0 10px var(--accent-glow);}
  .ring-day.today:not(.trained){box-shadow:0 0 0 2px rgba(var(--accent-rgb),.3) inset;}
  .quick-actions{display:flex; gap:8px; margin-bottom:8px;}
  .quick-actions .btn{flex:1; padding:12px 8px; font-size:12.5px; flex-direction:column; gap:4px;}
  .quick-actions .btn svg{width:17px; height:17px;}

  /* Sheets */
  .sheet-bg{position:fixed; inset:0; background:rgba(8,7,12,.6); backdrop-filter:blur(2px); z-index:70; display:flex; align-items:flex-end; animation:fadeIn .18s ease;}
  @keyframes fadeIn{from{opacity:0;} to{opacity:1;}}
  .sheet{background:var(--surface); border:1px solid var(--line); border-top-left-radius:22px; border-top-right-radius:22px; width:100%; max-width:560px; margin:0 auto; max-height:82vh; overflow-y:auto; padding:20px 18px calc(26px + env(safe-area-inset-bottom)); animation:sheetUp .26s cubic-bezier(.2,.8,.3,1);}
  @keyframes sheetUp{from{transform:translateY(40px); opacity:0;} to{transform:translateY(0); opacity:1;}}
  .sheet-handle{width:36px; height:4px; background:var(--line); border-radius:2px; margin:0 auto 16px;}
  .swatches{display:flex; gap:12px; margin-bottom:6px; flex-wrap:wrap;}
  .swatch{width:42px; height:42px; border-radius:50%; border:2px solid transparent; display:flex; align-items:center; justify-content:center; transition:transform .12s ease;}
  .swatch:active{transform:scale(.92);}
  .swatch.selected{border-color:var(--text);}
  .swatch svg{width:16px; height:16px; color:#15111F; opacity:0;}
  .swatch.selected svg{opacity:1;}
  .stepper{display:flex; align-items:center; gap:14px; justify-content:center; padding:6px 0;}
  .stepper button{width:38px; height:38px; border-radius:50%; background:var(--surface-2); border:1px solid var(--line); color:var(--text); font-size:18px; font-family:var(--mono);}
  .stepper .val{font-family:var(--mono); font-size:20px; min-width:64px; text-align:center;}
  .settings-section{margin-bottom:22px;}
  .settings-section .label{font-family:var(--mono); font-size:10px; letter-spacing:.1em; text-transform:uppercase; color:var(--muted); margin-bottom:10px;}

  .quick-log{display:flex; gap:8px; margin-bottom:14px;}
  .quick-log input{flex:1;}
  .quick-log button{flex-shrink:0;}

  #rest-timer{
    position:fixed; left:12px; right:12px; bottom:100px;
    background:var(--surface); border:1px solid var(--accent-dim); border-radius:16px;
    padding:12px 16px; display:none; align-items:center; gap:12px; z-index:55;
    box-shadow:0 10px 30px rgba(0,0,0,.5), 0 0 24px var(--accent-glow);
  }
  #rest-timer.show{display:flex;}
  #rest-timer .ring{width:38px; height:38px; flex-shrink:0;}
  #rest-timer .info{flex:1;}
  #rest-timer .label{font-family:var(--mono); font-size:9.5px; color:var(--muted); text-transform:uppercase; letter-spacing:.08em;}
  #rest-timer .time{font-family:var(--mono); font-size:19px; color:var(--text);}
  #rest-timer .actions{display:flex; gap:6px;}
  #rest-timer .actions button{background:var(--surface-2); border:1px solid var(--line); color:var(--text); border-radius:8px; padding:7px 10px; font-family:var(--mono); font-size:11px;}
</style>
</head>
<body>
<canvas id="fx"></canvas>
<div id="page">
  <div id="scroll-area"></div>
  <div id="nav-area"></div>
</div>
<div id="rest-timer">
  <svg class="ring" viewBox="0 0 40 40"><circle cx="20" cy="20" r="17" fill="none" stroke="#2A2436" stroke-width="4"/><circle id="rt-ring" cx="20" cy="20" r="17" fill="none" stroke="#9A8CFB" stroke-width="4" stroke-linecap="round" transform="rotate(-90 20 20)"/></svg>
  <div class="info"><div class="label">Rest</div><div class="time" id="rt-time">1:30</div></div>
  <div class="actions"><button id="rt-plus">+15</button><button id="rt-skip">Skip</button></div>
</div>

<script>
/* ================= Storage ================= */
const STORE_KEY = 'ledger_data_v3';
function load(){
  try{ const raw = localStorage.getItem(STORE_KEY); if(raw) return JSON.parse(raw); }catch(e){}
  return { plans: [], sessions: [], activeSession: null, bodyweight: [], sleep: [], settings:{ restSeconds:90, accent:'violet' } };
}
function save(){ localStorage.setItem(STORE_KEY, JSON.stringify(DB)); }
function migrateCardioFields(){
  let changed = false;
  DB.plans.forEach(p => p.days.forEach(d => d.exercises.forEach(ex => {
    if(ex.type === 'cardio' && ex.targetDistance === undefined){
      const m = (ex.reps||'').match(/(\d+(\.\d+)?)/);
      ex.targetDistance = m ? m[1] : '';
      ex.targetTime = '';
      changed = true;
    }
  })));
  if(changed) save();
}

/* ================= Exercise Library ================= */
const EXLIB = {
  'Push': [
    {name:'Bench Press', sets:4, reps:'6-8'},
    {name:'Incline DB Press', sets:3, reps:'8-10'},
    {name:'Fly', sets:3, reps:'10-12'},
    {name:'Shoulder Press', sets:3, reps:'8-10'},
    {name:'Shoulder Superset', sets:3, reps:'12-15'},
    {name:'Tricep Extension', sets:3, reps:'10-12'},
    {name:'Tricep Overhead', sets:3, reps:'10-12'},
  ],
  'Pull': [
    {name:'Pulldown', sets:4, reps:'8-10'},
    {name:'Dead Hang', sets:3, reps:'Max hold'},
    {name:'One Arm Pull', sets:3, reps:'8-10'},
    {name:'Bent Over Row', sets:4, reps:'6-8'},
    {name:'Trap / Rear Delt', sets:3, reps:'12-15'},
    {name:'Bicep Superset', sets:3, reps:'10-12'},
    {name:'Preacher Curl', sets:3, reps:'10-12'},
    {name:'Forearm', sets:3, reps:'15-20'},
  ],
  'Legs': [
    {name:'Squat', sets:4, reps:'6-8'},
    {name:'RDL', sets:3, reps:'8-10'},
    {name:'Leg Extension', sets:3, reps:'12-15'},
    {name:'Leg Curl', sets:3, reps:'12-15'},
    {name:'Calves', sets:4, reps:'12-15'},
    {name:'Hyperextension', sets:3, reps:'12-15'},
    {name:'Ab Superset', sets:3, reps:'15-20'},
  ],
  'Calisthenics Upper': [
    {name:'Explosive Pull Up', sets:4, reps:'5'},
    {name:'Negative Muscle Up', sets:3, reps:'3-5'},
    {name:'Band Assist Muscle Up', sets:3, reps:'3-5'},
    {name:'Kettlebell Push Up', sets:3, reps:'8-10'},
    {name:'Archer Push Up', sets:3, reps:'6-8'},
    {name:'Pike Push Up', sets:3, reps:'8-10'},
    {name:'Dips', sets:4, reps:'8-12'},
    {name:'Leg Raise / L-Sit', sets:3, reps:'Max'},
    {name:'Dead Hang', sets:3, reps:'Max hold'},
  ],
  'Calisthenics Lower': [
    {name:'Deadlift', sets:4, reps:'5'},
    {name:'Leg Press', sets:3, reps:'10-12'},
    {name:'Leg Curl', sets:3, reps:'12-15'},
    {name:'Leg Extension', sets:3, reps:'12-15'},
    {name:'Calves', sets:4, reps:'12-15'},
    {name:'Ab Superset', sets:3, reps:'15-20'},
  ],
  'Powerlifting': [
    {name:'Back Squat', sets:5, reps:'5'},
    {name:'Front Squat', sets:3, reps:'6-8'},
    {name:'Bench Press', sets:5, reps:'5'},
    {name:'Close Grip Bench', sets:3, reps:'6-8'},
    {name:'Deadlift', sets:3, reps:'5'},
    {name:'Barbell Row', sets:3, reps:'6-8'},
    {name:'Overhead Press', sets:3, reps:'6-8'},
  ],
  'Cardio': [
    {name:'Easy Run', type:'cardio', targetDistance:'5', targetTime:'30:00'},
    {name:'Tempo Run', type:'cardio', targetDistance:'5', targetTime:'25:00'},
    {name:'Long Run', type:'cardio', targetDistance:'10', targetTime:'60:00'},
    {name:'Sprint Intervals', type:'cardio', targetDistance:'0.4', targetTime:'2:00'},
  ],
};
function mkStrength(name, sets, reps){ return {id:uid(), name, type:'strength', sets, reps}; }
function mkCardio(name, targetDistance, targetTime){ return {id:uid(), name, type:'cardio', targetDistance, targetTime}; }
function fromLib(cat){
  return EXLIB[cat].map(it => it.type==='cardio'
    ? mkCardio(it.name, it.targetDistance, it.targetTime)
    : mkStrength(it.name, it.sets, it.reps));
}
function buildTemplatePlan(key){
  const day = (name, exercises) => ({ id:uid(), name, exercises });
  if(key === 'ppl'){
    return { id:uid(), name:'Push Pull Legs', days:[
      day('Push', fromLib('Push')), day('Pull', fromLib('Pull')), day('Legs', fromLib('Legs')),
    ]};
  }
  if(key === 'brosplit'){
    return { id:uid(), name:'Bro Split', days:[
      day('Push', fromLib('Push').filter(e=>!/Tricep/.test(e.name))),
      day('Pull', fromLib('Pull').filter(e=>!/Bicep|Preacher|Forearm/.test(e.name))),
      day('Legs', fromLib('Legs')),
      day('Arms', [
        mkStrength('Tricep Extension',3,'10-12'), mkStrength('Tricep Overhead',3,'10-12'),
        mkStrength('Bicep Superset',3,'10-12'), mkStrength('Preacher Curl',3,'10-12'), mkStrength('Forearm',3,'15-20'),
      ]),
    ]};
  }
  if(key === 'calisthenics'){
    return { id:uid(), name:'Calisthenics', days:[
      day('Upper', fromLib('Calisthenics Upper')), day('Lower', fromLib('Calisthenics Lower')),
    ]};
  }
  if(key === 'powerlifting'){
    return { id:uid(), name:'Powerlifting', days:[
      day('Squat Day', [mkStrength('Back Squat',5,'5'), mkStrength('Front Squat',3,'6-8'), mkStrength('Leg Press',3,'10-12'), mkStrength('Ab Superset',3,'15-20')]),
      day('Bench Day', [mkStrength('Bench Press',5,'5'), mkStrength('Close Grip Bench',3,'6-8'), mkStrength('Overhead Press',3,'6-8'), mkStrength('Tricep Extension',3,'10-12')]),
      day('Deadlift Day', [mkStrength('Deadlift',3,'5'), mkStrength('Barbell Row',3,'6-8'), mkStrength('Pull Up',3,'8-10'), mkStrength('Hyperextension',3,'12-15')]),
    ]};
  }
  if(key === 'run'){
    return { id:uid(), name:'Run', days:[
      day('Easy Run', [mkCardio('Easy Run','5','30:00')]),
      day('Tempo Run', [mkCardio('Tempo Run','5','25:00')]),
      day('Long Run', [mkCardio('Long Run','10','60:00')]),
    ]};
  }
  return { id:uid(), name:'New Plan', days:[] };
}

function esc(s){ return (s??'').toString().replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function parseDuration(str){
  if(str==null || str==='') return null;
  str = str.toString().trim();
  if(str.includes(':')){ const [m,s] = str.split(':').map(Number); return (m||0) + (s||0)/60; }

}

/* ---- Progressive overload helpers ---- */
function getPreviousSets(name, type, excludeId){
  for(let i=DB.sessions.length-1; i>=0; i--){
    const s = DB.sessions[i];
    if(s.id === excludeId) continue;
    const ex = s.exercises.find(e => e.name === name && (e.type||'strength') === (type||'strength'));
    if(ex && ex.sets.length) return ex.sets.map(st => ({...st}));
  }
  return null;
}
function prevMaxWeight(name, excludeId){
  let max = 0;
  DB.sessions.forEach(s => {
    if(s.id === excludeId) return;
    const ex = s.exercises.find(e => e.name === name && (e.type||'strength') === 'strength');
    if(!ex) return;
    ex.sets.forEach(st => { if(st.logged && st.weight) max = Math.max(max, parseFloat(st.weight)||0); });
  });
  return max;
}
function est1RM(weight, reps){
  const w = parseFloat(weight), r = parseInt(reps);
  if(!w || !r) return 0;
  return Math.round(w * (1 + r/30) * 10) / 10;
}
function computeStreak(){
  const dates = new Set(DB.sessions.map(s=>s.date));
  let cursor = new Date(); cursor.setHours(0,0,0,0);
  const iso = d => d.toISOString().slice(0,10);
  if(!dates.has(iso(cursor))) cursor.setDate(cursor.getDate()-1);
  let streak = 0;
  while(dates.has(iso(cursor))){ streak++; cursor.setDate(cursor.getDate()-1); }
  return streak;
}
function weekVolume(){
  const weekAgo = Date.now() - 7*24*60*60*1000;
  let vol = 0;
  DB.sessions.filter(s=>new Date(s.date).getTime()>=weekAgo).forEach(s=>{
    s.exercises.filter(e=>e.type!=='cardio').forEach(e=>{
      e.sets.forEach(st=>{ if(st.logged) vol += (parseFloat(st.weight)||0)*(parseInt(st.reps)||0); });
    });
  });
  return Math.round(vol);
}
function avgOfRange(arr, fromMs, toMs){
  const inRange = arr.filter(e => { const t = new Date(e.date).getTime(); return t>=fromMs && t<toMs; });
  if(!inRange.length) return null;
  return inRange.reduce((a,e)=>a+e.value,0)/inRange.length;
}
function weightDelta(){
  const now = Date.now();
  const cur = avgOfRange(DB.bodyweight, now-7*24*60*60*1000, now+1);
  const prev = avgOfRange(DB.bodyweight, now-14*24*60*60*1000, now-7*24*60*60*1000);
  if(cur==null || prev==null) return null;
  return { delta: cur-prev, current: cur };
}
function avgSleep7d(){ return avgOfRange(DB.sleep, Date.now()-7*24*60*60*1000, Date.now()+1); }
function sessionsThisMonth(){
  const now = new Date();
  return DB.sessions.filter(s=>{ const d=new Date(s.date+'T00:00:00'); return d.getMonth()===now.getMonth() && d.getFullYear()===now.getFullYear(); }).length;
}

function detectPlanDiff(session){
  if(!session.planId || !session.dayId) return null;
  const plan = DB.plans.find(p=>p.id===session.planId);
  if(!plan) return null;
  const day = plan.days.find(d=>d.id===session.dayId);
  if(!day) return null;
  const newExercises = [];
  const setIncreases = [];
  session.exercises.forEach(ex => {
    if(!ex.sets.length) return;
    const planEx = day.exercises.find(pe => pe.name === ex.name && (pe.type||'strength') === (ex.type||'strength'));
    if(!planEx){
      if(ex.type === 'cardio'){
        newExercises.push({ name: ex.name, type:'cardio', targetDistance: ex.targetDistance||'', targetTime: ex.targetTime||'' });
      } else {
        newExercises.push({ name: ex.name, type:'strength', sets: ex.sets.length, reps: ex.targetReps || '' });
      }
    } else if(ex.type !== 'cardio' && ex.sets.length > (planEx.sets||1)){
      setIncreases.push({ name: ex.name, from: planEx.sets||1, to: ex.sets.length });
    }
  });
  if(newExercises.length===0 && setIncreases.length===0) return null;
  return { plan, day, newExercises, setIncreases };
}
function applyDiffToPlan(diff){
  const { day, newExercises, setIncreases } = diff;
  newExercises.forEach(ne => {
    if(ne.type === 'cardio'){
      day.exercises.push({ id: uid(), name: ne.name, type:'cardio', targetDistance: ne.targetDistance, targetTime: ne.targetTime });
    } else {
      day.exercises.push({ id: uid(), name: ne.name, type:'strength', sets: ne.sets, reps: ne.reps });
    }
  });
  setIncreases.forEach(si => {
    const planEx = day.exercises.find(pe => pe.name === si.name);
    if(planEx) planEx.sets = si.to;
  });
  save();
}

/* ================= STATS (unified) ================= */
function genericChart(points){
  if(points.length < 2) return `<div class="empty-inline">Log more entries to see a trend line.</div>`;
  const w=500,h=130,pad=10;
  const vals = points.map(p=>p.value);
  const minV = Math.min(...vals), maxV = Math.max(...vals);
  const range = (maxV-minV)||1;
  const stepX = (w-pad*2)/(points.length-1);
  const coords = points.map((p,i)=>{
    const x = pad+i*stepX;
    const y = h-pad-((p.value-minV)/range)*(h-pad*2);
    return [x,y];
  });
  const path = coords.map((c,i)=>(i===0?'M':'L')+c[0].toFixed(1)+','+c[1].toFixed(1)).join(' ');
  const dots = coords.map(c=>`<circle cx="${c[0].toFixed(1)}" cy="${c[1].toFixed(1)}" r="3" fill="rgb(var(--accent-rgb))"/>`).join('');
  const areaPath = path + ` L${coords[coords.length-1][0].toFixed(1)},${h-pad} L${coords[0][0].toFixed(1)},${h-pad} Z`;
  return `<svg class="chart" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">
    <defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="rgb(var(--accent-rgb))" stop-opacity="0.25"/><stop offset="100%" stop-color="rgb(var(--accent-rgb))" stop-opacity="0"/></linearGradient></defs>
    <path d="${areaPath}" fill="url(#g)" stroke="none"/>
    <path d="${path}" fill="none" stroke="rgb(var(--accent-rgb))" stroke-width="2" vector-effect="non-scaling-stroke"/>
    ${dots}</svg>`;
}
function allExerciseNames(){
  const names = new Set();
  DB.sessions.forEach(s => s.exercises.forEach(e => { if(e.type!=='cardio') names.add(e.name); }));
  return [...names].sort();
}
function renderStrengthSection(){
  const names = allExerciseNames();
  if(names.length === 0) return `<div class="card"><h2>Strength</h2><div class="empty-inline">Log a lifting session to see progression here.</div></div>`;
  const sel = VIEW.progressEx && names.includes(VIEW.progressEx) ? VIEW.progressEx : names[0];
  const points = []; let best1RM = 0;
  DB.sessions.forEach(s => {
    const e = s.exercises.find(ex => ex.name === sel && ex.type !== 'cardio');
    if(!e) return;
    const logged = e.sets.filter(st => st.logged && st.weight !== '' && st.weight != null);
    if(logged.length === 0) return;
    const top = logged.reduce((a,b)=> (parseFloat(b.weight)||0) > (parseFloat(a.weight)||0) ? b : a);
    points.push({ date:s.date, value: parseFloat(top.weight)||0, reps: top.reps });
    logged.forEach(st => { best1RM = Math.max(best1RM, est1RM(st.weight, st.reps)); });
  });
  const maxW = points.reduce((m,p)=>Math.max(m,p.value), 0);
  const histRows = [...points].reverse().slice(0,6).map(p=>`
    <div class="hist-row"><span class="d">${fmtDate(p.date)}</span><span>${p.value} kg × ${p.reps}</span></div>`).join('');
  return `<div class="card">
    <div class="row" style="margin-bottom:10px;"><h2 style="margin:0;">Strength</h2>
      <div style="display:flex; gap:6px;">${maxW?`<span class="pr-badge">PR ${maxW}kg</span>`:''}${best1RM?`<span class="pr-badge">1RM~${best1RM}kg</span>`:''}</div>
    </div>
    <select class="ex-select" data-action="select-progress-ex">
      ${names.map(n=>`<option value="${esc(n)}" ${n===sel?'selected':''}>${esc(n)}</option>`).join('')}
    </select>
    ${genericChart(points)}
    ${histRows}
  </div>`;
}
function renderRunSection(){
  const runs = [];
  DB.sessions.forEach(s => {
    s.exercises.filter(e=>e.type==='cardio').forEach(e=>{
      e.sets.filter(st=>st.logged).forEach(st=>{
        const dist = parseFloat(st.distance), dur = parseDuration(st.duration);
        if(dist && dur) runs.push({ date:s.date, dist, dur, pace: dur/dist });
      });
    });
  });
  if(runs.length===0) return '';
  const points = runs.map(r=>({date:r.date, value: Math.round(r.pace*100)/100}));
  const best = runs.reduce((a,b)=> b.pace < a.pace ? b : a);
  const histRows = [...runs].reverse().slice(0,6).map(r=>`
    <div class="hist-row"><span class="d">${fmtDate(r.date)}</span><span>${r.dist} km · ${formatPace(r.pace)}</span></div>`).join('');
  return `<div class="card">
    <div class="row" style="margin-bottom:10px;"><h2 style="margin:0;">Running</h2><span class="pr-badge">Best ${formatPace(best.pace)}</span></div>
    ${genericChart(points)}
    ${histRows}
  </div>`;
}
function renderTrendSection(kind){
  const meta = {
    body: { arr: DB.bodyweight, unit:'kg', title:'Body Weight', decimals:1 },
    sleep: { arr: DB.sleep, unit:'hrs', title:'Sleep', decimals:1 },
    steps: { arr: DB.steps, unit:' steps', title:'Steps', decimals:0 },
  }[kind];
  const { arr, unit, title, decimals } = meta;
  if(arr.length === 0){
    return `<div class="card"><h2>${title}</h2><div class="empty-inline">No entries yet — log from Home.</div></div>`;
  }
  const now = Date.now();
  const cur = avgOfRange(arr, now-7*24*60*60*1000, now+1);
  const prev = avgOfRange(arr, now-14*24*60*60*1000, now-7*24*60*60*1000);
  const delta = (cur!=null && prev!=null) ? cur-prev : null;
  const points = [...arr].sort((a,b)=>a.date.localeCompare(b.date)).slice(-30).map(e=>({date:e.date, value:e.value}));
  const histRows = [...arr].reverse().slice(0,6).map(e=>`
    <div class="hist-row"><span class="d">${fmtDate(e.date)}</span><span>${e.value.toLocaleString()}${unit}</span></div>`).join('');
  return `<div class="card">
    <div class="row" style="margin-bottom:10px;"><h2 style="margin:0;">${title}</h2>
      <div style="display:flex; gap:6px;">
        ${cur!=null?`<span class="pr-badge">7d avg ${cur.toFixed(decimals)}${unit}</span>`:''}
        ${delta!=null?`<span class="pr-badge">${delta>=0?'+':''}${delta.toFixed(decimals)}${unit} vs prior wk</span>`:''}
      </div>
    </div>
    ${genericChart(points)}
    ${histRows}
  </div>`;
}

/* ================= Rest Timer ================= */
const REST = { active:false, remaining:0, total:0, timerId:null };
const timerBar = document.getElementById('rest-timer');
const rtRing = document.getElementById('rt-ring');
const rtTime = document.getElementById('rt-time');
const RING_C = 2*Math.PI*17;
rtRing.style.strokeDasharray = RING_C;
function startRestTimer(seconds){
  clearInterval(REST.timerId);
  REST.active = true; REST.remaining = seconds; REST.total = seconds;
  updateTimerUI(); timerBar.classList.add('show');
  REST.timerId = setInterval(()=>{ REST.remaining--; if(REST.remaining<=0){ finishRest(); return; } updateTimerUI(); }, 1000);
}
function finishRest(){ clearInterval(REST.timerId); REST.active=false; timerBar.classList.remove('show'); beep(); }
function updateTimerUI(){
  const m=Math.floor(Math.max(REST.remaining,0)/60), s=Math.max(REST.remaining,0)%60;
  rtTime.textContent = m+':'+String(s).padStart(2,'0');
  const frac = REST.total ? Math.max(REST.remaining,0)/REST.total : 0;
  rtRing.style.strokeDashoffset = RING_C*(1-frac);
}
function syncTimerBar(){ if(REST.active) timerBar.classList.add('show'); }
function beep(){
  try{
    const ctx = new (window.AudioContext||window.webkitAudioContext)();
    const o=ctx.createOscillator(), g=ctx.createGain();
    o.type='sine'; o.frequency.value=880; o.connect(g); g.connect(ctx.destination);
    g.gain.setValueAtTime(0.0001, ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.2, ctx.currentTime+0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime+0.4);
    o.start(); o.stop(ctx.currentTime+0.4);
  }catch(e){}
}
function playPR(){
  try{
    const ctx = new (window.AudioContext||window.webkitAudioContext)();
    [523.25,659.25,783.99].forEach((freq,i)=>{
      const o=ctx.createOscillator(), g=ctx.createGain();
      o.type='sine'; o.frequency.value=freq; o.connect(g); g.connect(ctx.destination);
      const t0=ctx.currentTime+i*0.09;
      g.gain.setValueAtTime(0.0001,t0);
      g.gain.exponentialRampToValueAtTime(0.18,t0+0.02);
      g.gain.exponentialRampToValueAtTime(0.0001,t0+0.3);
      o.start(t0); o.stop(t0+0.3);
    });
  }catch(e){}
}
function burst(x,y){
  for(let i=0;i<10;i++){
    const dot = document.createElement('div');
    const angle = (Math.PI*2*i)/10 + Math.random()*0.3;
    const dist = 36+Math.random()*28;
    dot.style.cssText = `position:fixed; left:${x}px; top:${y}px; width:5px; height:5px; margin:-2.5px; border-radius:50%; background:rgb(${ACCENT_RGB.join(',')}); pointer-events:none; z-index:80; transition:transform .55s cubic-bezier(.2,.8,.3,1), opacity .55s ease; opacity:1;`;
    document.body.appendChild(dot);
    requestAnimationFrame(()=>{
      dot.style.transform = `translate(${Math.cos(angle)*dist}px, ${Math.sin(angle)*dist}px)`;
      dot.style.opacity = '0';
    });
    setTimeout(()=>dot.remove(), 600);
  }
}

function attachHandlers(){
  root.querySelectorAll('[data-nav]').forEach(btn=>{
    btn.onclick = () => {
      TAB = btn.dataset.nav;
      VIEW = { screen: TAB==='train' ? (DB.activeSession?'train-session':'train-pick') : TAB };
      render();
    };
  });

  root.querySelectorAll('[data-action]').forEach(el=>{
    const a = el.dataset.action;

    if(a==='open-settings') el.onclick = () => { VIEW = {...VIEW, screen:'settings'}; render(); };
    if(a==='close-settings') el.onclick = () => { VIEW = { screen: TAB==='train' ? (DB.activeSession?'train-session':'train-pick') : TAB }; render(); };
    if(a==='set-accent') el.onclick = () => { DB.settings.accent = el.dataset.key; save(); applyTheme(); render(); };
    if(a==='rest-minus') el.onclick = () => { DB.settings.restSeconds = Math.max(15, DB.settings.restSeconds-15); save(); render(); };
    if(a==='rest-plus') el.onclick = () => { DB.settings.restSeconds = DB.settings.restSeconds+15; save(); render(); };
    if(a==='export-data') el.onclick = () => {
      const blob = new Blob([JSON.stringify(DB,null,2)], {type:'application/json'});
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.href = url; link.download = `ledger-backup-${todayISO()}.json`;
      document.body.appendChild(link); link.click(); link.remove();
      URL.revokeObjectURL(url);
    };
    if(a==='clear-data') el.onclick = () => {
      if(!confirm('Erase all plans, sessions, and logs? This cannot be undone.')) return;
      if(!confirm('Really sure? Consider exporting a backup first.')) return;
      localStorage.removeItem(STORE_KEY);
      DB = load(); DB.settings.accent = DB.settings.accent || 'violet';
      applyTheme(); VIEW={screen:'home'}; TAB='home'; render();
    };

    if(a==='open-sheet') el.onclick = () => { VIEW.sheet = el.dataset.kind; render(); };
    if(a==='close-sheet') el.onclick = () => { VIEW.sheet = null; PENDING_SESSION = null; PENDING_DIFF = null; render(); };
    if(a==='save-sheet') el.onclick = () => {
      const inp = document.getElementById('sheet-input'); const v = parseFloat(inp.value);
      if(!v){ VIEW.sheet=null; render(); return; }
      const arr = VIEW.sheet==='body' ? DB.bodyweight : VIEW.sheet==='sleep' ? DB.sleep : DB.steps;
      const existing = arr.find(e=>e.date===todayISO());
      if(existing) existing.value = v; else arr.push({id:uid(), date:todayISO(), value:v});
      VIEW.sheet = null; save(); render();
    };
    if(a==='go-train') el.onclick = () => {
      TAB='train'; VIEW = { screen: DB.activeSession?'train-session':'train-pick' }; render();
    };
    if(a==='resume-session') el.onclick = () => { TAB='train'; VIEW={screen:'train-session'}; render(); };

    if(a==='new-plan') el.onclick = () => { VIEW.sheet = 'new-plan-template'; render(); };
    if(a==='create-from-template') el.onclick = () => {
      const plan = buildTemplatePlan(el.dataset.key);
      DB.plans.push(plan); save();
      VIEW = { screen:'plan-edit', planId: plan.id }; render();
    };
    if(a==='open-plan') el.onclick = () => { VIEW = { screen:'plan-edit', planId:el.dataset.id }; render(); };
    if(a==='dup-plan') el.onclick = () => {
      const p = DB.plans.find(p=>p.id===el.dataset.id);
      const copy = JSON.parse(JSON.stringify(p));
      copy.id = uid(); copy.name = p.name + ' (copy)';
      copy.days.forEach(d => { d.id = uid(); d.exercises.forEach(ex => ex.id = uid()); });
      DB.plans.push(copy); save(); render();
    };
    if(a==='back-plans') el.onclick = () => { VIEW = { screen:'plans' }; render(); };
    if(a==='rename-plan') el.onblur = () => { const p=DB.plans.find(p=>p.id===VIEW.planId); p.name=el.value.trim()||p.name; save(); };
    if(a==='del-plan') el.onclick = () => {
      if(!confirm('Delete this plan? This cannot be undone.')) return;
      DB.plans = DB.plans.filter(p=>p.id!==VIEW.planId); save();
      VIEW = { screen:'plans' }; render();
    };
    if(a==='add-day') el.onclick = () => {
      const p=DB.plans.find(p=>p.id===VIEW.planId); p.days.push({id:uid(),name:'New Day',exercises:[]}); save(); render();
    };
    if(a==='rename-day') el.onblur = () => {
      const p=DB.plans.find(p=>p.id===VIEW.planId); const d=p.days.find(d=>d.id===el.dataset.day);
      d.name=el.value.trim()||d.name; save();
    };
    if(a==='del-day') el.onclick = () => {
      const p=DB.plans.find(p=>p.id===VIEW.planId); p.days=p.days.filter(d=>d.id!==el.dataset.day); save(); render();
    };
    if(a==='add-ex') el.onclick = () => {
      const p=DB.plans.find(p=>p.id===VIEW.planId); const d=p.days.find(d=>d.id===el.dataset.day);
      d.exercises.push({id:uid(), name:'', sets:3, reps:'', type:'strength'}); save(); render();
    };
    if(a==='open-library') el.onclick = () => { VIEW.libraryDayId = el.dataset.day; VIEW.sheet = 'library'; render(); };
    if(a==='add-from-library') el.onclick = () => {
      const p = DB.plans.find(p=>p.id===VIEW.planId);
      const d = p.days.find(d=>d.id===VIEW.libraryDayId);
      const cat = el.dataset.cat; const name = el.dataset.name;
      const item = (EXLIB[cat]||[]).find(it=>it.name===name);
      if(!item || d.exercises.some(e=>e.name===name)) return;
      if(item.type === 'cardio'){
        d.exercises.push({ id:uid(), name:item.name, type:'cardio', targetDistance:item.targetDistance||'', targetTime:item.targetTime||'' });
      } else {
        d.exercises.push({ id:uid(), name:item.name, type:'strength', sets:item.sets, reps:item.reps });
      }
      save(); render();
    };
    if(a==='del-ex') el.onclick = () => {
      const p=DB.plans.find(p=>p.id===VIEW.planId); const d=p.days.find(d=>d.id===el.dataset.day);
      d.exercises=d.exercises.filter(e=>e.id!==el.dataset.ex); save(); render();
    };
    if(a==='toggle-type') el.onclick = () => {
      const p=DB.plans.find(p=>p.id===VIEW.planId); const d=p.days.find(d=>d.id===el.dataset.day);
      const ex=d.exercises.find(e=>e.id===el.dataset.ex);
      if(ex.type==='cardio'){ ex.type='strength'; if(ex.sets==null) ex.sets=3; if(ex.reps==null) ex.reps=''; }
      else { ex.type='cardio'; if(ex.targetDistance==null) ex.targetDistance=''; if(ex.targetTime==null) ex.targetTime=''; }
      save(); render();
    };
    if(a==='ex-field') el.onblur = () => {
      const p=DB.plans.find(p=>p.id===VIEW.planId); const d=p.days.find(d=>d.id===el.dataset.day);
      const ex=d.exercises.find(e=>e.id===el.dataset.ex); const f=el.dataset.field;
      ex[f] = f==='sets' ? (parseInt(el.value)||1) : el.value; save();
    };

    if(a==='edit-rest') el.onclick = () => {
      const v = prompt('Default rest time (seconds):', DB.settings.restSeconds);
      if(!v) return; DB.settings.restSeconds = parseInt(v)||90; save(); render();
    };
    if(a==='start-session') el.onclick = () => {
      const p=DB.plans.find(p=>p.id===el.dataset.plan); const d=p.days.find(d=>d.id===el.dataset.day);
      DB.activeSession = {
        id:uid(), date:todayISO(), startedAt:Date.now(), planName:p.name, dayName:d.name,
        planId:p.id, dayId:d.id,
        exercises: d.exercises.map(ex => ex.type==='cardio' ? {
          name:ex.name, type:'cardio', targetDistance:ex.targetDistance||'', targetTime:ex.targetTime||'',
          sets:[{distance:'', duration:'', logged:false}],
          prevSets: getPreviousSets(ex.name, 'cardio')
        } : {
          name:ex.name, type:'strength', targetSets:ex.sets, targetReps:ex.reps,
          sets: Array.from({length:ex.sets||1}, ()=>({weight:'', reps:'', logged:false})),
          prevSets: getPreviousSets(ex.name, 'strength')
        })
      };
      save(); VIEW={screen:'train-session'}; render();
    };
    if(a==='start-freestyle') el.onclick = () => {
      DB.activeSession = { id:uid(), date:todayISO(), startedAt:Date.now(), planName:'', dayName:'Freestyle', exercises:[] };
      save(); VIEW={screen:'train-session'}; render();
    };

    if(a==='copy-last') el.onclick = () => {
      const ex = DB.activeSession.exercises[el.dataset.ex];
      ex.sets = ex.prevSets.map(p => ex.type==='cardio' ? {distance:p.distance, duration:p.duration, logged:false} : {weight:p.weight, reps:p.reps, logged:false});
      save(); render();
    };
    if(a==='set-field') el.onblur = () => {
      const ex = DB.activeSession.exercises[el.dataset.ex]; ex.sets[el.dataset.set][el.dataset.field]=el.value; save();
    };
    if(a==='cardio-field') el.onblur = () => {
      const ex = DB.activeSession.exercises[el.dataset.ex]; ex.sets[el.dataset.set][el.dataset.field]=el.value; save(); render();
    };
    if(a==='toggle-set') el.onclick = () => {
      const ex = DB.activeSession.exercises[el.dataset.ex]; const st = ex.sets[el.dataset.set];
      st.logged = !st.logged;
      let doBurst = false, rect = null;
      if(st.logged && ex.type !== 'cardio'){
        const prevBest = prevMaxWeight(ex.name, DB.activeSession.id);
        const w = parseFloat(st.weight)||0;
        if(w > 0 && w > prevBest){ st.isPR = true; playPR(); doBurst = true; rect = el.getBoundingClientRect(); }
        else st.isPR = false;
        startRestTimer(DB.settings.restSeconds);
      } else if(!st.logged){ st.isPR = false; }
      save();
      if(doBurst) burst(rect.left+rect.width/2, rect.top+rect.height/2);
      render();
    };
    if(a==='add-set') el.onclick = () => {
      const ex = DB.activeSession.exercises[el.dataset.ex];
      ex.sets.push(ex.type==='cardio' ? {distance:'',duration:'',logged:false} : {weight:'',reps:'',logged:false});
      save(); render();
    };
    if(a==='add-exercise-to-session') el.onclick = () => {
      const name = prompt('Exercise name:'); if(!name) return;
      const cardio = confirm('Is this a cardio exercise? OK = Cardio, Cancel = Strength');
      DB.activeSession.exercises.push(cardio
        ? {name, type:'cardio', targetDistance:'', targetTime:'', sets:[{distance:'',duration:'',logged:false}], prevSets:getPreviousSets(name,'cardio')}
        : {name, type:'strength', targetSets:null, targetReps:'', sets:[{weight:'',reps:'',logged:false}], prevSets:getPreviousSets(name,'strength')});
      save(); render();
    };
    if(a==='finish-session') el.onclick = () => {
      const s = DB.activeSession;
      const cleaned = s.exercises.map(ex => {
        const {prevSets, ...rest} = ex;
        return {...rest, sets: ex.sets.filter(st =>
          ex.type==='cardio' ? (st.distance!=='' || st.duration!=='') : (st.weight!=='' || st.reps!=='')
        )};
      });
      const candidate = {...s, exercises: cleaned, durationMin: Math.max(1, Math.round((Date.now()-s.startedAt)/60000))};
      const diff = detectPlanDiff(candidate);
      if(diff){
        PENDING_SESSION = candidate; PENDING_DIFF = diff;
        VIEW.sheet = 'finish-diff'; render();
      } else {
        finalizeSession(candidate);
      }
    };
    if(a==='finish-update-template') el.onclick = () => {
      applyDiffToPlan(PENDING_DIFF);
      finalizeSession(PENDING_SESSION);
      PENDING_SESSION = null; PENDING_DIFF = null;
    };
    if(a==='finish-once') el.onclick = () => {
      finalizeSession(PENDING_SESSION);
      PENDING_SESSION = null; PENDING_DIFF = null;
    };
    if(a==='discard-session') el.onclick = () => {
      if(!confirm('Discard this session? Nothing will be saved.')) return;
      DB.activeSession = null; save(); finishRest(); clearInterval(elapsedInterval);
      VIEW={screen:'train-pick'}; render();
    };

    if(a==='select-progress-ex') el.onchange = () => { VIEW.progressEx = el.value; render(); };
  });

  const importInput = document.getElementById('import-file');
  if(importInput){
    importInput.onchange = () => {
      const file = importInput.files[0]; if(!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        try{
          const imported = JSON.parse(reader.result);
          if(!imported.plans || !imported.sessions) throw new Error('bad format');
          if(!confirm('Replace current data with this backup? This cannot be undone.')) return;
          DB = imported;
          if(!DB.bodyweight) DB.bodyweight=[]; if(!DB.sleep) DB.sleep=[]; if(!DB.steps) DB.steps=[];
          if(!DB.settings) DB.settings={restSeconds:90, accent:'violet'};
          migrateCardioFields();
          save(); applyTheme(); render();
        }catch(e){ alert('Could not read that file — make sure it is a Ledger backup.'); }
      };
      reader.readAsText(file);
    };
  }
}

/* ================= Ambient particle field ================= */
(function(){
  const canvas = document.getElementById('fx');
  const ctx = canvas.getContext('2d');
  let particles = [];
  const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  function resize(){
    canvas.width = window.innerWidth * devicePixelRatio;
    canvas.height = window.innerHeight * devicePixelRatio;
    canvas.style.width = window.innerWidth+'px';
    canvas.style.height = window.innerHeight+'px';
    ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);
  }
  function initParticles(){
    const count = Math.min(26, Math.floor(window.innerWidth/22));
    particles = Array.from({length:count}, () => ({
      x: Math.random()*window.innerWidth, y: Math.random()*window.innerHeight,
      r: Math.random()*1.6+0.6, vy: -(Math.random()*0.12+0.03), vx: (Math.random()-0.5)*0.05,
      o: Math.random()*0.35+0.08, phase: Math.random()*Math.PI*2
    }));
  }
  function tick(t){
    ctx.clearRect(0,0,window.innerWidth,window.innerHeight);
    particles.forEach(p=>{
      p.x += p.vx; p.y += p.vy;
      if(p.y < -10) p.y = window.innerHeight+10;
      if(p.x < -10) p.x = window.innerWidth+10;
      if(p.x > window.innerWidth+10) p.x = -10;
      const flicker = 0.7 + 0.3*Math.sin(t/1800 + p.phase);
      ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
      ctx.fillStyle = `rgba(${ACCENT_RGB.join(',')},${(p.o*flicker).toFixed(3)})`;
      ctx.fill();
    });
    if(!reduced) requestAnimationFrame(tick);
  }
  resize(); initParticles();
  window.addEventListener('resize', ()=>{ resize(); initParticles(); });
  if(reduced){ tick(0); } else { requestAnimationFrame(tick); }
})();

applyTheme();
render();
</script>
