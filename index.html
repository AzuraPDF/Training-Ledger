<!DOCTYPE html>
<html lang="en-AU" data-acc="lime">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d0e10">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ledger">
<title>Ledger</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
:root{
  /* Graphite training log: one dark world, one accent, an editorial serif for names, mono for every number. */
  --bg:#0d0e10; --s1:#15171a; --s2:#1c1f23; --s3:#262a2f; --line:#2a2e34;
  --ink:#ecebe6; --mute:#8d929a; --faint:#5c6168;
  --acc:#c6f16d; --acc-ink:#121608;
  --good:#7fd88f; --warn:#f0b75e; --bad:#ff7a6b;
  --g1:#a7dc6e; --g2:#74a9ff; --g3:#e8d468; --g4:#ee9d4e; --g5:#c595ee; --g0:#8d929a;
  --serif:'Instrument Serif', ui-serif, Georgia, serif;
  --sans:'Geist', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;
  --mono:'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
  --r:18px; --nav:68px;
  color-scheme:dark;
}
[data-acc="sky"]{--acc:#8fc8ff;--acc-ink:#06121e}
[data-acc="ember"]{--acc:#ff8c42;--acc-ink:#1e0c02}
[data-acc="bone"]{--acc:#e9e3d5;--acc-ink:#15140f}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink)}
body{font:15px/1.45 var(--sans);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;overscroll-behavior-y:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.app{max-width:560px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 14px) 16px calc(env(safe-area-inset-bottom) + var(--nav) + 120px)}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}
.mark{font:italic 400 26px/1 var(--serif);letter-spacing:-.01em;display:flex;align-items:center;gap:8px;text-decoration:none}
.mark b{width:9px;height:9px;border-radius:3px;background:var(--acc);display:inline-block;transform:translateY(-1px)}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.eyebrow{font:500 11px/1.2 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--mute)}
.mute{color:var(--mute)} .faint{color:var(--faint)} .small{font-size:13px}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.wrap{flex-wrap:wrap}
h1,h2,h3{margin:0;font-weight:400;text-wrap:balance}
.display{font-family:var(--serif);font-size:46px;line-height:.95;letter-spacing:-.015em}
.display.sm{font-size:34px}
h2.serif{font-family:var(--serif);font-size:30px;line-height:1}
h3{font:600 16px/1.25 var(--sans)}
.section-h{display:flex;align-items:baseline;justify-content:space-between;margin:12px 2px -2px}
.section-h h2{font-family:var(--serif);font-size:24px}
.card{background:var(--s1);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.card.flush{padding:0;overflow:hidden}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:42px;padding:0 15px;border-radius:13px;border:1px solid var(--line);background:var(--s2);font-weight:600;font-size:14px;text-decoration:none;white-space:nowrap;transition:transform .12s ease, background .15s}
.btn:active{transform:scale(.97)}
.btn.pri{background:var(--acc);color:var(--acc-ink);border-color:transparent}
.btn.ghost{background:transparent}
.btn.big{height:56px;width:100%;font-size:16px;border-radius:16px}
.btn.wide{width:100%}
.btn.sm{height:34px;padding:0 11px;font-size:13px;border-radius:10px}
.btn.danger{color:var(--bad)}
.btn.armed{background:var(--bad);color:#1c0503;border-color:transparent}
.icon{width:36px;height:36px;display:inline-grid;place-items:center;border-radius:10px;border:0;background:transparent;color:var(--mute)}
.icon:hover{background:var(--s2);color:var(--ink)}
.chip{display:inline-flex;align-items:center;gap:7px;height:34px;padding:0 13px;border-radius:999px;border:1px solid var(--line);background:var(--s1);font-size:13px;font-weight:500;white-space:nowrap}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:2px 16px}
.chips::-webkit-scrollbar{display:none}
.dot{width:7px;height:7px;border-radius:50%;background:var(--acc);display:inline-block}
.pill{display:inline-flex;align-items:center;gap:6px;height:22px;padding:0 8px;border-radius:7px;font:500 11px/1 var(--mono);letter-spacing:.04em;background:var(--s3);color:var(--mute);white-space:nowrap}
.pill.acc{background:color-mix(in srgb,var(--acc) 16%,transparent);color:var(--acc)}
.pill.warn{background:color-mix(in srgb,var(--warn) 16%,transparent);color:var(--warn)}
.pill.good{background:color-mix(in srgb,var(--good) 16%,transparent);color:var(--good)}
.gchip{display:inline-grid;place-items:center;min-width:28px;height:22px;padding:0 5px;border-radius:6px;font:600 11px/1 var(--mono);background:color-mix(in srgb,var(--gc,var(--g0)) 17%,transparent);color:var(--gc,var(--g0))}

/* hero */
.hero{position:relative;overflow:hidden;background:linear-gradient(160deg,var(--s2),var(--s1) 70%);border:1px solid var(--line);border-radius:24px;padding:20px}
.hero::after{content:"";position:absolute;right:-20px;top:-20px;width:220px;height:200px;background-image:radial-gradient(circle,rgba(236,235,230,.16) 1px,transparent 1.3px);background-size:11px 11px;-webkit-mask-image:radial-gradient(closest-side,#000,transparent);mask-image:radial-gradient(closest-side,#000,transparent);pointer-events:none}
.hero > *{position:relative;z-index:1}
.hero .display{margin:10px 0 4px}
.prev-list{list-style:none;margin:16px 0 18px;padding:0;display:grid;gap:7px}
.prev-list li{display:grid;grid-template-columns:34px 1fr auto;align-items:center;gap:10px;font-size:14px}
.prev-list li .mono{color:var(--mute);font-size:13px}
.meta-line{display:flex;gap:14px;flex-wrap:wrap;font:500 12px var(--mono);color:var(--mute);margin-bottom:16px}

/* week */
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.wd{display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 0 9px;border-radius:14px;background:var(--s1);border:1px solid var(--line)}
.wd .l{font:500 10px var(--mono);color:var(--faint);letter-spacing:.1em}
.wd .n{font:500 15px var(--mono)}
.wd .t{font:600 10px var(--mono);color:var(--mute);height:12px}
.wd i{width:6px;height:6px;border-radius:50%;background:var(--s3)}
.wd.done i{background:var(--acc)}
.wd.today{border-color:var(--ink)}
.wd.rest .t{color:var(--faint)}

/* tiles */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--s1);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:6px;min-height:112px;text-align:left}
button.tile{cursor:pointer}
.tile .v{font:500 28px/1 var(--mono);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.tile .v small{font-size:13px;color:var(--mute);margin-left:3px;letter-spacing:0}
.tile .s{font-size:12px;color:var(--mute);margin-top:auto;display:flex;align-items:center;gap:6px}
.up{color:var(--good)} .dn{color:var(--warn)}
.spark{width:100%;height:30px;margin-top:auto}

/* list rows */
.lrow{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:13px 16px;border-top:1px solid var(--line)}
.lrow:first-child{border-top:0}
.lrow .t{font-weight:600}
.lrow .sub{font-size:12px;color:var(--mute)}
.lrow .r{text-align:right}

/* train */
.trainhead{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.clock{font:500 30px/1 var(--mono);letter-spacing:-.02em;text-align:right}
.bar{height:4px;border-radius:4px;background:var(--s2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--acc);transition:width .3s}
.exgroup{position:relative;display:flex;flex-direction:column;gap:10px;padding-left:14px}
.exgroup::before{content:"";position:absolute;left:0;top:6px;bottom:6px;width:3px;border-radius:3px;background:var(--gc)}
.exgroup .gl{color:var(--gc);margin:4px 0 -2px}
.ex{background:var(--s1);border:1px solid var(--line);border-radius:var(--r);padding:14px 14px 10px}
.exhead{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.exhead .nm{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.exmeta{font-size:12px;color:var(--mute);margin:5px 0 10px}
.setgrid{display:grid;gap:6px}
.setrow{display:grid;grid-template-columns:22px 62px 1fr 1fr 44px;gap:7px;align-items:center}
.setrow.hd{font:500 10px var(--mono);letter-spacing:.1em;color:var(--faint);text-transform:uppercase}
.setrow.hd span{text-align:center}
.setrow .si{font:500 13px var(--mono);color:var(--faint);text-align:center}
.setrow .prev{font-size:12px;color:var(--faint);text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.setrow input{width:100%;height:42px;border-radius:11px;border:1px solid transparent;background:var(--s2);text-align:center;font:500 16px var(--mono);font-variant-numeric:tabular-nums;outline:none;min-width:0}
.setrow input:focus{border-color:var(--faint);background:var(--s3)}
.setrow input::placeholder{color:var(--faint)}
.chk{height:42px;border-radius:11px;border:1px solid var(--line);background:transparent;color:var(--faint);display:grid;place-items:center}
.setrow.on input{background:color-mix(in srgb,var(--acc) 9%,var(--s1));color:var(--ink)}
.setrow.on .chk{background:var(--acc);color:var(--acc-ink);border-color:transparent}
.setrow.pr .si{color:var(--acc)}
.setrow.pr .si::after{content:"PR";display:block;font-size:8px;letter-spacing:.05em}
.setrow.flash{animation:flash .7s ease}
@keyframes flash{0%{transform:scale(1)}30%{transform:scale(1.02)}100%{transform:scale(1)}}
.exfoot{display:flex;gap:6px;margin-top:8px}
.exfoot .btn{flex:1}
.pace{font:500 12px var(--mono);color:var(--mute);text-align:center}

/* dock + nav */
.nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 10px);width:min(528px,calc(100% - 24px));height:var(--nav);display:grid;grid-template-columns:repeat(5,1fr);background:rgba(21,23,26,.82);backdrop-filter:blur(18px) saturate(1.4);-webkit-backdrop-filter:blur(18px) saturate(1.4);border:1px solid var(--line);border-radius:24px;z-index:20;padding:6px}
.nav a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;text-decoration:none;color:var(--faint);border-radius:18px;font:500 10px var(--mono);letter-spacing:.06em;text-transform:uppercase}
.nav a.on{color:var(--ink);background:var(--s2)}
.nav a.on svg{color:var(--acc)}
.floater{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + var(--nav) + 20px);width:min(528px,calc(100% - 24px));z-index:19;display:flex;flex-direction:column;gap:8px}
.sesspill{display:flex;align-items:center;justify-content:space-between;gap:10px;height:50px;padding:0 8px 0 16px;border-radius:16px;background:var(--acc);color:var(--acc-ink);text-decoration:none;font-weight:600;box-shadow:0 12px 30px -10px rgba(0,0,0,.6)}
.sesspill .mono{font-weight:600}
.sesspill span.go{background:rgba(0,0,0,.12);border-radius:11px;padding:8px 12px;font-size:13px}
.rest{display:flex;align-items:center;gap:12px;padding:10px 10px 10px 12px;border-radius:18px;background:rgba(28,31,35,.94);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid var(--line);box-shadow:0 12px 30px -10px rgba(0,0,0,.7)}
.rest .ring{width:44px;height:44px;flex:none}
.rest .ring svg{width:44px;height:44px;transform:rotate(-90deg)}
.rest .tm{font:500 24px/1 var(--mono);flex:1}
.rest .tm small{display:block;font:500 10px var(--mono);color:var(--mute);letter-spacing:.1em;text-transform:uppercase;margin-bottom:4px}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:40;display:flex;align-items:flex-end;justify-content:center;animation:fade .18s ease}
.sheet{width:min(560px,100%);max-height:88%;overflow:auto;background:var(--s1);border:1px solid var(--line);border-bottom:0;border-radius:26px 26px 0 0;padding:10px 18px calc(env(safe-area-inset-bottom) + 22px);animation:up .26s cubic-bezier(.2,.8,.2,1)}
.grab{width:38px;height:4px;border-radius:4px;background:var(--s3);margin:0 auto 14px}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font:500 11px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--mute)}
.inp{height:46px;border-radius:12px;border:1px solid var(--line);background:var(--s2);padding:0 13px;outline:none;width:100%;font-size:16px}
.inp:focus{border-color:var(--faint)}
.inp.big{height:64px;font:500 32px var(--mono);text-align:center}
select.inp{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--mute) 50%),linear-gradient(135deg,var(--mute) 50%,transparent 50%);background-position:calc(100% - 18px) 20px,calc(100% - 13px) 20px;background-size:5px 5px;background-repeat:no-repeat}
.seg{display:flex;background:var(--s2);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;height:36px;border-radius:9px;border:0;background:transparent;color:var(--mute);font:500 13px var(--mono)}
.seg button.on{background:var(--s3);color:var(--ink)}
.swatches{display:flex;gap:10px}
.sw{width:40px;height:40px;border-radius:12px;border:2px solid transparent;background:var(--c)}
.sw.on{border-color:var(--ink)}
.exlist{display:flex;flex-direction:column;max-height:46vh;overflow:auto;margin-top:8px}
.exlist button{display:flex;justify-content:space-between;align-items:center;text-align:left;padding:12px 4px;border:0;border-bottom:1px solid var(--line);background:transparent;font-size:15px}
.exlist button .mono{font-size:11px;color:var(--faint)}

/* plans */
.dayc{display:flex;flex-direction:column;gap:12px}
.dayc .dh{display:flex;align-items:center;justify-content:space-between;gap:10px}
.dayc .dh h3{font:400 26px/1 var(--serif)}
.exl{display:grid;gap:8px}
.exl .er{display:grid;grid-template-columns:30px 1fr auto;gap:10px;align-items:center;font-size:14px}
.exl .er .mono{font-size:12px;color:var(--mute)}
.exl .er .nt{grid-column:2/4;font-size:12px;color:var(--faint);margin-top:-6px}
.ee{display:grid;grid-template-columns:46px 1fr 44px 64px 30px;gap:6px;align-items:center}
.ee input,.ee .tbtn{height:38px;border-radius:9px;border:1px solid var(--line);background:var(--s2);padding:0 8px;font-size:14px;width:100%;min-width:0;outline:none}
.ee input.c{text-align:center;font-family:var(--mono)}
.ee .x{width:30px;height:38px;border:0;background:transparent;color:var(--faint);display:grid;place-items:center;padding:0}
.ee .x svg{width:16px;height:16px}
.sched{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.sched .c{background:var(--s2);border-radius:12px;padding:9px 2px;text-align:center;display:flex;flex-direction:column;gap:5px;min-width:0}
.sched .c .l{font:500 10px var(--mono);color:var(--faint);letter-spacing:.1em}
.sched .c .v{font:600 12px var(--mono);color:var(--ink)}
.sched .c.rest .v{color:var(--faint)}
.sched select{width:100%;height:30px;border:0;border-radius:8px;background:var(--s3);font:600 11px var(--mono);text-align:center;padding:0 2px;appearance:none}

/* history */
.mhead{font:500 11px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--mute);margin:10px 2px -4px;display:flex;justify-content:space-between}
.hs{display:grid;grid-template-columns:52px 1fr auto;gap:14px;align-items:center;padding:14px 16px;border-top:1px solid var(--line);text-align:left;background:transparent;border-left:0;border-right:0;border-bottom:0;width:100%}
.hs:first-child{border-top:0}
.hs .d{text-align:center}
.hs .d b{display:block;font:500 24px/1 var(--mono)}
.hs .d span{font:500 10px var(--mono);color:var(--mute);letter-spacing:.1em}
.hs .t{font-weight:600}
.hs .sub{font-size:12px;color:var(--mute);display:flex;gap:10px;flex-wrap:wrap;margin-top:3px}
.hs .vol{font:500 14px var(--mono);text-align:right}
.hs .vol small{display:block;font-size:11px;color:var(--faint)}
.dex{padding:12px 0;border-top:1px solid var(--line)}
.dex .sets{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.dex .sets span{font:500 12px var(--mono);background:var(--s2);border-radius:8px;padding:5px 8px}
.dex .sets span.pr{background:color-mix(in srgb,var(--acc) 18%,transparent);color:var(--acc)}

/* charts */
.chart{width:100%;height:auto;display:block}
.chart text{font-family:var(--mono);font-size:17px;fill:var(--faint)}
.chart .lbl{fill:var(--ink);font-weight:500}
.empty-chart{height:120px;display:grid;place-items:center;color:var(--faint);font-size:13px;background:var(--s2);border-radius:14px}
.heat{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,1fr);gap:3px}
.heat i{aspect-ratio:1;border-radius:3px;background:var(--s2)}
.heat i.l1{background:color-mix(in srgb,var(--acc) 45%,var(--s2))}
.heat i.l2{background:var(--acc)}
.heat i.now{outline:1.5px solid var(--ink);outline-offset:-1.5px}
.kv{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0 6px}
.kv div{background:var(--s2);border-radius:12px;padding:10px}
.kv b{display:block;font:500 18px var(--mono)}
.kv span{font:500 10px var(--mono);color:var(--mute);letter-spacing:.08em;text-transform:uppercase}
table.t{width:100%;border-collapse:collapse;font-size:13px}
table.t td{padding:9px 2px;border-top:1px solid var(--line)}
table.t td.n{text-align:right;font-family:var(--mono)}

.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 12px);transform:translate(-50%,-140%);transition:transform .3s cubic-bezier(.2,.8,.2,1);z-index:60;background:var(--ink);color:var(--bg);padding:11px 16px;border-radius:14px;font-weight:600;font-size:14px;max-width:calc(100% - 32px);box-shadow:0 14px 30px -10px rgba(0,0,0,.6)}
.toast.show{transform:translate(-50%,0)}
.toast.pr{background:var(--acc);color:var(--acc-ink)}
.empty{text-align:center;padding:30px 16px;color:var(--mute)}
.note{font-size:13px;color:var(--mute);line-height:1.5}
textarea.inp{height:160px;padding:12px;font:12px var(--mono)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (min-width:700px){.display{font-size:56px}}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <a class="mark" href="#today" aria-label="Ledger, today"><b></b>Ledger</a>
    <span class="eyebrow" id="topdate"></span>
  </header>
  <main id="main"></main>
</div>
<div class="floater" id="floater"></div>
<nav class="nav" id="nav" aria-label="Main"></nav>
<div id="sheetroot"></div>

function lineChart(pts, { h = 190, goal = null, fmt = v => fmtN(Math.round(v * 10) / 10), unit = '' } = {}) {
  if (pts.length < 2) return `<div class="empty-chart">Log ${2 - pts.length} more to draw a trend</div>`;

  const t0 = pts[0].t, t1 = pts[pts.length - 1].t, span = (t1 - t0) || 1;
  const X = t => pl + (t - t0) / span * (W - pl - pr), Y = v => pt + (1 - (v - lo) / (hi - lo)) * (H - pt - pb);

  const area = line + ` L${X(t1).toFixed(1)} ${H - pb} L${X(t0).toFixed(1)} ${H - pb} Z`;
  const gid = 'g' + Math.random().toString(36).slice(2, 7);

  const g = goal != null ? `<line x1="${pl}" x2="${W - pr}" y1="${Y(goal)}" y2="${Y(goal)}" stroke="var(--good)" stroke-dasharray="6 6" opacity=".7"/><text x="${pl + 4}" y="${Y(goal) - 8}" style="fill:var(--good)">goal ${fmt(goal)}</text>` : '';
  const last = pts[pts.length - 1];
  const d0 = new Date(t0), d1 = new Date(t1);
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Trend from ${fmt(pts[0].v)} to ${fmt(last.v)}${unit}">
    <defs><linearGradient id="${gid}" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="var(--acc)" stop-opacity=".28"/><stop offset="1" stop-color="var(--acc)" stop-opacity="0"/></linearGradient></defs>
    ${grid}${g}<path d="${area}" fill="url(#${gid})"/><path d="${line}" stroke="var(--acc)" stroke-width="2.5" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
    ${pts.map(p => `<circle cx="${X(p.t)}" cy="${Y(p.v)}" r="3" fill="var(--s1)" stroke="var(--acc)" stroke-width="1.6"/>`).join('')}

    <text class="lbl" x="${W - pr + 10}" y="${Y(last.v) + 6}">${fmt(last.v)}</text>
    <text x="${pl}" y="${H - 6}">${d0.getDate()} ${MONTHS[d0.getMonth()]}</text><text x="${W - pr}" y="${H - 6}" text-anchor="end">${d1.getDate()} ${MONTHS[d1.getMonth()]}</text>
  </svg>`;

function vProgress() {
  const names = [...idx().names.entries()].filter(([, v]) => v.count && v.type !== 'cardio').sort((a, b) => b[1].count - a[1].count);
  if (!ui.exName || !names.some(([k]) => k === ui.exName)) ui.exName = names[0]?.[0] || null;
  let lift = '<div class="card empty">Log a lift to see progress.</div>';
  if (ui.exName) {
    const entries = idx().byName.get(ui.exName) || [];
    const series = entries.map(({ s, ex }) => { let best = null, vol = 0; ex.sets.forEach(st => { if (!setDone(st)) return; vol += num(st.weight) * num(st.reps); const e = e1rm(st.weight, st.reps); if (!best || e > best.e) best = { e, st }; }); return best && best.e ? { t: tsOf(s), v: best.e, best, vol, date: s.date } : null; }).filter(Boolean);
    const top = series.reduce((m, x) => x.v > (m?.v || 0) ? x : m, null), first = series[0], last = series[series.length - 1];
    lift = `<div class="card"><div class="row between"><div><span class="eyebrow">Estimated 1-rep max</span><h2 class="serif" style="margin-top:6px">${esc(idx().names.get(ui.exName).name)}</h2></div></div>
      <div class="kv"><div><b>${top ? Math.round(top.v) : '—'}</b><span>Best e1RM</span></div><div><b>${top ? `${fmtN(top.best.st.weight)}×${top.best.st.reps}` : '—'}</b><span>Best set</span></div><div><b class="${last && first && last.v >= first.v ? 'up' : 'dn'}">${series.length > 1 ? (last.v >= first.v ? '+' : '') + Math.round(last.v - first.v) : '—'}</b><span>Since first</span></div></div>
      ${lineChart(series, { fmt: v => Math.round(v), unit: ' kg' })}
      <table class="t" style="margin-top:8px">${series.slice(-5).reverse().map(x => `<tr><td>${parseISO(x.date).getDate()} ${MONTHS[parseISO(x.date).getMonth()]}</td><td class="n">${fmtN(x.best.st.weight)} × ${x.best.st.reps}</td><td class="n faint">${Math.round(x.vol)} kg vol</td></tr>`).join('')}</table></div>`;
  }
  const bw = [...S.bodyweight].sort((a, b) => a.date < b.date ? -1 : 1).map(x => ({ t: parseISO(x.date).getTime(), v: num(x.value) }));
  const goal = num(S.settings.goalWeight) || null;
  // heatmap
  const weeks = 18, start = mondayOf(new Date()); start.setDate(start.getDate() - (weeks - 1) * 7);
  const cnt = {}; S.sessions.forEach(s => cnt[s.date] = (cnt[s.date] || 0) + 1);
  const today = iso();
  let heat = ''; for (let i = 0; i < weeks * 7; i++) { const d = new Date(start); d.setDate(start.getDate() + i); const k = iso(d), c = cnt[k] || 0; heat += `<i class="${c >= 2 ? 'l2' : c ? 'l1' : ''} ${k === today ? 'now' : ''}" title="${k}${c ? ` · ${c} session${c > 1 ? 's' : ''}` : ''}"></i>`; }
  const active = Object.keys(cnt).filter(k => parseISO(k) >= start).length;
  // weekly volume
  const wv = [], wl = []; const m0 = mondayOf(new Date());
  for (let w = 11; w >= 0; w--) { const a = new Date(m0); a.setDate(a.getDate() - w * 7); const b = new Date(a); b.setDate(b.getDate() + 7);
    wv.push(S.sessions.filter(s => { const t = parseISO(s.date); return t >= a && t < b; }).reduce((x, s) => x + volOf(s), 0)); wl.push(`${a.getDate()}/${a.getMonth() + 1}`); }
  return `<section class="stack"><h1 class="display sm">Progress</h1>
    <div class="chips">${names.slice(0, 10).map(([k, v]) => `<button class="chip ${k === ui.exName ? 'on' : ''}" data-act="pickEx" data-k="${k}">${esc(v.name)}</button>`).join('')}</div>
    ${names.length > 10 ? `<select class="inp" data-edit="ui:exName" aria-label="All exercises" id="exsel">${names.map(([k, v]) => `<option value="${k}" ${k === ui.exName ? 'selected' : ''}>${esc(v.name)} (${v.count})</option>`).join('')}</select>` : ''}
    ${lift}
    <div class="card"><div class="row between"><div><span class="eyebrow">Bodyweight</span><h2 class="serif" style="margin-top:6px">${bw.length ? fmtN(bw[bw.length - 1].v) + ' kg' : 'No entries'}</h2></div><button class="btn sm" data-act="logSheet" data-kind="bodyweight">${I.plus} Log</button></div><div style="margin-top:12px">${lineChart(bw, { goal, unit: ' kg' })}</div>
      ${goal ? '' : '<p class="note" style="margin:10px 0 0">Set a goal weight in More to draw a target line.</p>'}</div>
    <div class="card"><div class="row between" style="margin-bottom:12px"><span class="eyebrow">Consistency · 18 weeks</span><span class="mono small mute">${active} active days</span></div><div class="heat">${heat}</div></div>
    <div class="card"><div class="row between" style="margin-bottom:8px"><span class="eyebrow">Weekly volume</span><span class="mono small mute">kg × reps</span></div>${barChart(wv, wl, { fmt: v => v >= 1000 ? (v / 1000).toFixed(1) + 't' : Math.round(v) })}</div>
  </section>`;
}

/* ---------- render ---------- */
const VIEWS = { today: vToday, train: vTrain, plans: vPlans, history: vHistory, progress: vProgress, more: vMore };
function render() {
  document.documentElement.dataset.acc = S.settings.accent || 'lime';
  const n = new Date(); document.getElementById('topdate').textContent = `${DAYS[n.getDay()]} ${n.getDate()} ${MONTHS[n.getMonth()]}`;
  document.getElementById('main').innerHTML = VIEWS[view]();
  const tabs = [['today', 'Today'], ['plans', 'Plans'], ['history', 'History'], ['progress', 'Progress'], ['more', 'More']];
  document.getElementById('nav').innerHTML = tabs.map(([k, l]) => `<a href="#${k}" class="${view === k || (k === 'today' && view === 'train') ? 'on' : ''}" ${view === k ? 'aria-current="page"' : ''}>${I[k]}<span>${l}</span></a>`).join('');
  renderFloater();
}
function renderFloater() {
  const a = S.activeSession, f = document.getElementById('floater');
  let h = '';
  if (a && a.restEnd && a.restEnd > Date.now()) {
    const left = a.restEnd - Date.now(), frac = left / (a.restTotal * 1000), C = 2 * Math.PI * 18;
    h += `<div class="rest"><div class="ring"><svg viewBox="0 0 44 44"><circle cx="22" cy="22" r="18" stroke="var(--s3)" stroke-width="4"/><circle id="ringc" cx="22" cy="22" r="18" stroke="var(--acc)" stroke-width="4" stroke-dasharray="${C}" stroke-dashoffset="${C * (1 - frac)}"/></svg></div>
      <div class="tm"><small>Rest</small><span id="restt">${clockStr(left + 999)}</span></div><button class="btn sm" data-act="restAdj" data-v="-15">−15</button><button class="btn sm" data-act="restAdj" data-v="15">+15</button><button class="btn sm pri" data-act="restSkip">Skip</button></div>`;
  }
  if (a && view !== 'train') h += `<a class="sesspill" href="#train"><span>${esc(a.dayName)} · <span class="mono" data-clock>${clockStr(Date.now() - a.startedAt)}</span></span><span class="go">Resume</span></a>`;
  f.innerHTML = h;
}
function route() { const v = location.hash.slice(1); view = VIEWS[v] ? v : 'today'; closeSheet(); render(); window.scrollTo(0, 0); }

/* ---------- sheet & toast ---------- */
function openSheet(html) { document.getElementById('sheetroot').innerHTML = `<div class="scrim" data-act="scrim"><div class="sheet" role="dialog" aria-modal="true"><div class="grab"></div>${html}</div></div>`; const f = document.querySelector('.sheet [autofocus]'); if (f) setTimeout(() => f.focus(), 60); }
function closeSheet() { document.getElementById('sheetroot').innerHTML = ''; }
let toastT;
function toast(msg, kind = '') { const t = document.getElementById('toast'); t.textContent = msg; t.className = 'toast show ' + kind; clearTimeout(toastT); toastT = setTimeout(() => t.className = 'toast', 2600); }

/* ---------- session engine ---------- */
let wakeLock = null, audioCtx = null;
async function holdWake() { try { if (S.activeSession && 'wakeLock' in navigator && !wakeLock) { wakeLock = await navigator.wakeLock.request('screen'); wakeLock.addEventListener('release', () => wakeLock = null); } } catch (e) {} }
function dropWake() { try { wakeLock && wakeLock.release(); } catch (e) {} wakeLock = null; }
function beep() { try { audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)(); [0, .18, .36].forEach((d, i) => { const o = audioCtx.createOscillator(), g = audioCtx.createGain(); o.frequency.value = i === 2 ? 1046 : 784; g.gain.setValueAtTime(.0001, audioCtx.currentTime + d); g.gain.exponentialRampToValueAtTime(.25, audioCtx.currentTime + d + .02); g.gain.exponentialRampToValueAtTime(.0001, audioCtx.currentTime + d + .15); o.connect(g).connect(audioCtx.destination); o.start(audioCtx.currentTime + d); o.stop(audioCtx.currentTime + d + .16); }); } catch (e) {} }
const buzz = p => { try { navigator.vibrate && navigator.vibrate(p); } catch (e) {} };

function startSession(plan, day) {
  if (S.activeSession) { toast('Finish or discard the current session first'); location.hash = '#train'; return; }
  S.activeSession = { id: uid(), date: iso(), startedAt: Date.now(), planName: plan ? plan.name : '', dayName: day ? day.name : 'Freestyle', planId: plan ? plan.id : '', dayId: day ? day.id : '',
    exercises: (day ? day.exercises : []).map(newSessEx) };
  save(); holdWake(); try { audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {}
  if (location.hash === '#train') render(); else location.hash = '#train';
}
function newSessEx(e) {
  const n = Math.max(1, Math.round(num(e.sets)) || (isCardio(e) ? 1 : 3));
  return { name: e.name, type: e.type || 'strength', group: e.group || '', note: e.note || '', targetSets: num(e.sets) || n, targetReps: e.reps || '', targetDistance: e.targetDistance || '', targetTime: e.targetTime || '',
    sets: Array.from({ length: n }, () => isCardio(e) ? { distance: '', duration: '', logged: false } : { weight: '', reps: '', logged: false }) };
}
function supersetNext(i) {
  const ex = S.activeSession.exercises, n = gnum(ex[i].group); if (!n) return null;
  const j = i + 1; return j < ex.length && gnum(ex[j].group) === n ? j : null;
}
function startRest(sec) { const a = S.activeSession; a.restEnd = Date.now() + sec * 1000; a.restTotal = sec; a.restAlerted = false; save(); renderFloater(); }
function finishData() {
  const a = S.activeSession, lastAt = Math.max(0, ...a.exercises.flatMap(e => e.sets.map(s => s.logged ? s.at || 0 : 0)));
  const end = lastAt ? Math.min(Date.now(), lastAt + 8 * 60000) : Date.now();
  return { dur: Math.max(1, Math.round((end - a.startedAt) / 60000)) };
}

/* ---------- actions ---------- */
const findPlan = () => S.plans.find(p => p.id === ui.planId);
const ACT = {
  scrim(t, e) { if (e.target === t) closeSheet(); },
  close() { closeSheet(); },
  startDay(t) { const p = S.plans.find(x => x.id === t.dataset.plan), d = p && p.days.find(x => x.id === t.dataset.day); if (d) startSession(p, d); },
  startFree() { startSession(null, null); },
  check(t) {
    const a = S.activeSession, i = +t.dataset.i, j = +t.dataset.j, ex = a.exercises[i], st = ex.sets[j];
    if (st.logged) { st.logged = false; st.isPR = false; delete st.at; save(); render(); return; }
    if (isCardio(ex)) {
      if (!num(st.distance) && !num(st.duration)) { const d = document.getElementById(`d${i}_${j}`), tt = document.getElementById(`t${i}_${j}`); st.distance = st.distance || d?.placeholder || ''; st.duration = st.duration || tt?.placeholder || ''; }
      if (!num(st.distance) && !num(st.duration)) { toast('Enter distance or time first'); return; }
      st.logged = true; st.at = Date.now(); save(); toast('Run logged'); render(); return;
    }
    const w = document.getElementById(`w${i}_${j}`), r = document.getElementById(`r${i}_${j}`);
    if (st.weight === '' || st.weight == null) st.weight = w?.placeholder || '';
    if (!num(st.reps)) st.reps = r?.placeholder || '';
    if (!num(st.reps)) { toast('Enter reps first'); r && r.focus(); return; }
    const e1 = e1rm(st.weight, st.reps), hist = bestE1(ex.name, a.startedAt);
    const sess = Math.max(0, ...ex.sets.filter((s, k) => k !== j && s.logged).map(s => e1rm(s.weight, s.reps)));
    st.isPR = hist > 0 && e1 > hist && e1 > sess;
    st.logged = true; st.at = Date.now(); buzz(15);
    const nx = supersetNext(i);
    if (nx != null) { a.restEnd = 0; toast(`Now ${a.exercises[nx].group} · ${a.exercises[nx].name}`); }
    else startRest(num(S.settings.restSeconds) || 120);
    if (st.isPR) { buzz([20, 60, 20]); toast(`New best · ${ex.name} ${fmtN(st.weight)} × ${st.reps} (${Math.round(e1)} e1RM)`, 'pr'); }
    save(); render();
    const row = document.getElementById(`row${i}_${j}`); if (row && st.isPR) row.classList.add('flash');
    const next = document.getElementById(`w${i}_${j + 1}`); if (next && nx == null && !matchMedia('(pointer:coarse)').matches) next.focus();
  },
  addSet(t) { const ex = S.activeSession.exercises[+t.dataset.i]; const last = ex.sets[ex.sets.length - 1] || {}; ex.sets.push(isCardio(ex) ? { distance: '', duration: '', logged: false } : { weight: last.weight || '', reps: '', logged: false }); save(); render(); },
  rmSet(t) { const ex = S.activeSession.exercises[+t.dataset.i]; if (ex.sets.length > 1) { ex.sets.pop(); save(); render(); } else toast('Remove the exercise from its menu instead'); },
  restAdj(t) { const a = S.activeSession; a.restEnd = Math.max(Date.now() + 1000, a.restEnd + num(t.dataset.v) * 1000); a.restTotal = Math.max(a.restTotal, (a.restEnd - Date.now()) / 1000); save(); renderFloater(); },
  restSkip() { S.activeSession.restEnd = 0; save(); renderFloater(); },
  exMenu(t) {
    const i = +t.dataset.i, a = S.activeSession, ex = a.exercises[i];
    openSheet(`<span class="eyebrow">Exercise</span><h2 class="serif" style="margin:6px 0 16px">${esc(ex.name)}</h2>
      <div class="stack"><div class="field"><label for="exn">Name</label><input class="inp" id="exn" value="${esc(ex.name)}"></div>
      <div class="row"><div class="field" style="width:90px"><label for="exg">Group</label><input class="inp" id="exg" value="${esc(ex.group)}" placeholder="1A"></div><div class="field" style="flex:1"><label for="exnote">Note</label><input class="inp" id="exnote" value="${esc(ex.note)}" placeholder="Cue, seat height, grip"></div></div>
      <button class="btn pri" data-act="exSave" data-i="${i}">Save changes</button>
      <div class="row"><button class="btn" style="flex:1" data-act="exMove" data-i="${i}" data-dir="-1" ${i ? '' : 'disabled'}>${I.up} Move up</button><button class="btn" style="flex:1" data-act="exMove" data-i="${i}" data-dir="1" ${i < a.exercises.length - 1 ? '' : 'disabled'}>${I.down} Move down</button></div>
      <button class="btn ghost danger" data-act="exRemove" data-i="${i}" data-confirm="Tap again to remove">Remove from session</button></div>`);
  },
  exSave(t) { const ex = S.activeSession.exercises[+t.dataset.i]; ex.name = document.getElementById('exn').value.trim() || ex.name; ex.group = document.getElementById('exg').value.trim().toUpperCase(); ex.note = document.getElementById('exnote').value.trim(); save(); closeSheet(); render(); },
  exMove(t) { const ex = S.activeSession.exercises, i = +t.dataset.i, j = i + num(t.dataset.dir); if (j < 0 || j >= ex.length) return; [ex[i], ex[j]] = [ex[j], ex[i]]; save(); closeSheet(); render(); },
  exRemove(t) { S.activeSession.exercises.splice(+t.dataset.i, 1); save(); closeSheet(); render(); },
  addExSheet() {
    openSheet(`<span class="eyebrow">Add exercise</span><input class="inp" id="exsearch" placeholder="Search or type a new name" autofocus style="margin-top:10px" autocomplete="off"><div class="exlist" id="exlist">${exListHtml('')}</div>`);
  },
  addExName(t) {
    const name = (t.dataset.name || document.getElementById('exsearch')?.value || '').trim(); if (!name) return;
    const known = idx().names.get(norm(name)); const type = known ? known.type : (/\brun\b|jog|row erg|bike|cycle/i.test(name) ? 'cardio' : 'strength');
    S.activeSession.exercises.push(newSessEx({ name: known ? known.name : name, type, sets: type === 'cardio' ? 1 : 3, reps: '' }));
    save(); closeSheet(); render(); setTimeout(() => window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' }), 50);
  },
  finishSheet() {
    const a = S.activeSession, f = finishData(), lg = a.exercises.reduce((n, e) => n + e.sets.filter(s => s.logged).length, 0);
    const vol = a.exercises.reduce((t, ex) => t + (isCardio(ex) ? 0 : ex.sets.reduce((x, st) => x + (st.logged ? num(st.weight) * num(st.reps) : 0), 0)), 0);
    const prs = a.exercises.flatMap(ex => ex.sets.filter(s => s.logged && s.isPR).map(s => `${esc(ex.name)} · ${fmtN(s.weight)} × ${s.reps}`));
    openSheet(`<span class="eyebrow">Session summary</span><h2 class="display sm" style="margin:8px 0 14px">${esc(a.dayName)}</h2>
      <div class="kv"><div><b>${lg}</b><span>Sets</span></div><div><b>${vol >= 1000 ? (vol / 1000).toFixed(1) + 't' : Math.round(vol)}</b><span>Volume</span></div><div><b>${prs.length}</b><span>PRs</span></div></div>
      ${prs.length ? `<div class="card" style="margin:8px 0;background:var(--s2)">${prs.map(p => `<div class="row" style="padding:3px 0"><span class="pill acc">PR</span><span class="small">${p}</span></div>`).join('')}</div>` : ''}
      <div class="field" style="margin:14px 0"><label for="fdur">Duration (minutes)</label><input class="inp" id="fdur" inputmode="numeric" value="${f.dur}"><span class="note">Measured to your last logged set, so a forgotten finish doesn't inflate it.</span></div>
      <div class="stack"><button class="btn pri big" data-act="saveSession" ${lg ? '' : 'disabled'}>${lg ? 'Save session' : 'Log a set to save'}</button><div class="row"><button class="btn" style="flex:1" data-act="close">Keep training</button><button class="btn ghost danger" style="flex:1" data-act="discard" data-confirm="Tap again to discard">Discard</button></div></div>`);
  },
  saveSession() {
    const a = S.activeSession, dur = Math.max(1, Math.round(num(document.getElementById('fdur')?.value)) || finishData().dur);
    const rec = { id: a.id, date: a.date, startedAt: a.startedAt, planName: a.planName, dayName: a.dayName, planId: a.planId, dayId: a.dayId, durationMin: dur,
      exercises: a.exercises.map(ex => ({ name: ex.name, type: ex.type, group: ex.group || undefined, targetSets: ex.targetSets, targetReps: ex.targetReps, ...(isCardio(ex) ? { targetDistance: ex.targetDistance, targetTime: ex.targetTime } : {}),
        sets: ex.sets.filter(s => s.logged).map(s => { const o = { ...s }; delete o.at; return o; }) })).filter(ex => ex.sets.length) };
    S.sessions.push(rec); S.activeSession = null; save(); dropWake(); closeSheet();
    toast(`Saved · ${setsOf(rec)} sets in ${fmtDur(dur)}`); location.hash = '#today'; render();
  },
  discard() { S.activeSession = null; save(); dropWake(); closeSheet(); toast('Session discarded'); location.hash = '#today'; render(); },
  // plans
  pickPlan(t) { ui.planId = t.dataset.id; ui.edit = false; render(); },
  toggleEdit() { ui.edit = !ui.edit; render(); },
  setActive(t) { const p = S.plans.find(x => x.id === t.dataset.id); S.settings.activePlanId = p.id; const sc = S.settings.schedule || {}; for (const k in sc) if (!p.days.some(d => d.id === sc[k])) delete sc[k]; S.settings.schedule = sc; save(); toast(`${p.name} is now active`); render(); },
  newPlan() { const p = { id: uid(), name: 'New plan', days: [{ id: uid(), name: 'Day 1', focus: '', exercises: [] }] }; S.plans.push(p); ui.planId = p.id; ui.edit = true; save(); render(); },
  dupPlan() { const p = JSON.parse(JSON.stringify(findPlan())); p.id = uid(); p.name += ' copy'; p.days.forEach(d => { d.id = uid(); d.exercises.forEach(e => e.id = uid()); }); S.plans.push(p); ui.planId = p.id; save(); render(); },
  delPlan() { const id = ui.planId; S.plans = S.plans.filter(p => p.id !== id); if (S.settings.activePlanId === id) { S.settings.activePlanId = S.plans[S.plans.length - 1]?.id || null; S.settings.schedule = {}; } ui.planId = null; ui.edit = false; save(); render(); },
  addDay() { const p = findPlan(); p.days.push({ id: uid(), name: `Day ${p.days.length + 1}`, focus: '', exercises: [] }); save(); render(); },
  delDay(t) { const p = findPlan(); p.days = p.days.filter(d => d.id !== t.dataset.day); const sc = S.settings.schedule || {}; for (const k in sc) if (sc[k] === t.dataset.day) delete sc[k]; save(); render(); },
  moveDay(t) { const p = findPlan(), i = p.days.findIndex(d => d.id === t.dataset.day), j = i + num(t.dataset.dir); if (j < 0 || j >= p.days.length) return; [p.days[i], p.days[j]] = [p.days[j], p.days[i]]; save(); render(); },
  addEx(t) { const d = findPlan().days.find(x => x.id === t.dataset.day), c = t.dataset.type === 'cardio';
    const lastG = d.exercises.length ? gnum(d.exercises[d.exercises.length - 1].group) : 0;
    d.exercises.push({ id: uid(), name: c ? 'Run' : '', sets: c ? 1 : 3, reps: c ? '30 min' : '10', type: c ? 'cardio' : 'strength', group: c ? '' : `${lastG + 1}A` }); save(); render();
    const inputs = document.querySelectorAll(`[data-edit^="ex:${ui.planId}:${d.id}:"][data-edit$=":name"]`); inputs[inputs.length - 1]?.focus(); },
  delEx(t) { const d = findPlan().days.find(x => x.id === t.dataset.day); d.exercises = d.exercises.filter(e => e.id !== t.dataset.ex); save(); render(); },
  // history
  histFilter(t) { ui.hist = t.dataset.v; render(); },
  sessSheet(t) {
    const s = S.sessions.find(x => x.id === t.dataset.id); if (!s) return; const d = parseISO(s.date);
    openSheet(`<span class="eyebrow">${DAYS[d.getDay()]} ${d.getDate()} ${MONTHS[d.getMonth()]} ${d.getFullYear()} · ${esc(s.planName || 'Freestyle')}</span><h2 class="display sm" style="margin:8px 0 12px">${esc(s.dayName)}</h2>
      <div class="kv"><div><b>${setsOf(s)}</b><span>Sets</span></div><div><b>${Math.round(volOf(s))}</b><span>kg volume</span></div><div><b>${prsOf(s)}</b><span>PRs</span></div></div>
      ${(s.exercises || []).map(ex => { const sets = ex.sets.filter(setDone); return `<div class="dex"><div class="row" style="gap:8px">${ex.group ? `<span class="gchip" style="--gc:${gcolor(gnum(ex.group))}">${esc(ex.group)}</span>` : ''}<b>${esc(ex.name)}</b></div><div class="sets">${sets.length ? sets.map(st => isCardio(ex) ? `<span>${fmtN(st.distance)} km${num(st.duration) ? ` · ${fmtN(st.duration)} min` : ''}</span>` : `<span class="${st.isPR ? 'pr' : ''}">${fmtN(st.weight)} × ${esc(st.reps)}</span>`).join('') : '<span class="faint">Not logged</span>'}</div></div>`; }).join('')}
      <div class="row" style="margin-top:14px;align-items:flex-end"><div class="field" style="flex:1"><label for="sdur">Duration (min)</label><input class="inp" id="sdur" inputmode="numeric" data-edit="sess:${s.id}:durationMin" value="${esc(s.durationMin)}"></div><div class="field" style="flex:1"><label for="sdate">Date</label><input class="inp" id="sdate" type="date" data-edit="sess:${s.id}:date" value="${esc(s.date)}"></div></div>
      ${num(s.durationMin) > LEFT_OPEN ? '<p class="note" style="color:var(--warn)">This session was left open in the old app. Set the real duration above.</p>' : ''}
      <div class="row" style="margin-top:14px"><button class="btn" style="flex:1" data-act="close">Close</button><button class="btn ghost danger" style="flex:1" data-act="delSess" data-id="${s.id}" data-confirm="Tap again to delete">Delete</button></div>`);
  },
  delSess(t) { S.sessions = S.sessions.filter(s => s.id !== t.dataset.id); save(); closeSheet(); render(); toast('Session deleted'); },
  // progress
  pickEx(t) { ui.exName = t.dataset.k; render(); },
  // quick logs
  logSheet(t) {
    const k = t.dataset.kind, meta = { bodyweight: ['Bodyweight', 'kg', 'decimal'], sleep: ['Sleep', 'hours', 'decimal'], steps: ['Steps', 'steps', 'numeric'] }[k];
    const list = [...S[k]].sort((a, b) => a.date < b.date ? 1 : -1), last = list[0];
    openSheet(`<span class="eyebrow">Log ${meta[0].toLowerCase()}</span><h2 class="serif" style="margin:6px 0 14px">${meta[0]}</h2>
      <div class="stack"><input class="inp big" id="lv" inputmode="${meta[2]}" placeholder="${last ? esc(last.value) : '0'}" aria-label="${meta[0]} in ${meta[1]}" autofocus>
      <div class="row"><div class="field" style="flex:1"><label for="ld">Date</label><input class="inp" id="ld" type="date" value="${iso()}"></div><span class="mono mute" style="padding-top:22px">${meta[1]}</span></div>
      <button class="btn pri big" data-act="logSave" data-kind="${k}">Save</button></div>
      ${list.length ? `<div class="card flush" style="margin-top:16px">${list.slice(0, 6).map(x => `<div class="lrow"><span class="mono">${parseISO(x.date).getDate()} ${MONTHS[parseISO(x.date).getMonth()]} · ${fmtN(x.value)} ${meta[1]}</span><button class="icon" data-act="logDel" data-kind="${k}" data-id="${x.id}" aria-label="Delete entry">${I.x}</button></div>`).join('')}</div>` : ''}`);
  },
  logSave(t) { const k = t.dataset.kind, v = num(document.getElementById('lv').value || document.getElementById('lv').placeholder), d = document.getElementById('ld').value || iso();
    if (!v) { toast('Enter a value first'); return; }
    S[k] = S[k].filter(x => x.date !== d); S[k].push({ id: uid(), date: d, value: v }); save(); closeSheet(); render(); toast('Logged'); },
  logDel(t) { const k = t.dataset.kind; S[k] = S[k].filter(x => x.id !== t.dataset.id); save(); ACT.logSheet({ dataset: { kind: k } }); render(); },
  // settings
  setRest(t) { S.settings.restSeconds = num(t.dataset.v); save(); render(); },
  setAccent(t) { S.settings.accent = t.dataset.v; save(); render(); },
  exportFile() {
    try { const blob = new Blob([JSON.stringify(S, null, 2)], { type: 'application/json' }), a = document.createElement('a');
      a.href = URL.createObjectURL(blob); a.download = `ledger-backup-${iso()}.json`; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 4000);
      toast('Backup downloaded. If nothing appeared, use Copy backup.'); } catch (e) { ACT.copyJson(); }
  },
  copyJson() {
    const txt = JSON.stringify(S, null, 2);
    const fallback = () => openSheet(`<span class="eyebrow">Backup JSON</span><p class="note">Select all and copy, then paste into a .json file.</p><textarea class="inp" readonly id="bj">${esc(txt)}</textarea>`);
    try { navigator.clipboard.writeText(txt).then(() => toast('Backup copied to clipboard'), fallback); } catch (e) { fallback(); }
  },
  importPick() { document.getElementById('importFile').click(); },
  importDo(t) { const d = ui.pendingImport; if (!d) return; S = normalize(t.dataset.mode === 'replace' ? d : mergeData(S, d)); if (t.dataset.mode === 'replace' && d.settings) S.settings = normalize(d).settings; ui.pendingImport = null; save(); closeSheet(); render(); toast('Backup imported'); },
  resetSeed() { try { localStorage.removeItem(KEY); } catch (e) {} S = load(); save(); render(); toast('Reset to the 12 Nov backup'); },
};
function exListHtml(q) {
  const k = norm(q); const all = [...idx().names.values()].sort((a, b) => b.count - a.count).filter(n => !k || norm(n.name).includes(k)).slice(0, 40);
  return (q.trim() && !idx().names.has(k) ? `<button data-act="addExName" data-name="${esc(q.trim())}"><span>Add “${esc(q.trim())}”</span><span class="mono">NEW</span></button>` : '') +
    all.map(n => `<button data-act="addExName" data-name="${esc(n.name)}"><span>${esc(n.name)}</span><span class="mono">${n.type === 'cardio' ? 'CARDIO' : n.count ? n.count + '×' : 'PLAN'}</span></button>`).join('');
}
function applyEdit(path, val) {
  const [kind, ...p] = path.split(':');
  if (kind === 'plan') { const pl = S.plans.find(x => x.id === p[0]); pl[p[1]] = val.trim(); }
  else if (kind === 'day') { const d = S.plans.find(x => x.id === p[0]).days.find(x => x.id === p[1]); d[p[2]] = val.trim(); }
  else if (kind === 'ex') { const e = S.plans.find(x => x.id === p[0]).days.find(x => x.id === p[1]).exercises.find(x => x.id === p[2]);
    e[p[3]] = p[3] === 'sets' ? Math.max(1, Math.round(num(val)) || 1) : p[3] === 'group' ? val.trim().toUpperCase() : val.trim(); }
  else if (kind === 'sched') { S.settings.schedule = S.settings.schedule || {}; if (val) S.settings.schedule[p[0]] = val; else delete S.settings.schedule[p[0]]; }
  else if (kind === 'sess') { const s = S.sessions.find(x => x.id === p[0]); if (p[1] === 'durationMin') s.durationMin = Math.max(1, Math.round(num(val))); else if (val) s[p[1]] = val; save(); render(); return; }
  else if (kind === 'cfg') { S.settings[p[0]] = val.trim() === '' ? '' : num(val); }
  else if (kind === 'ui') { ui[p[0]] = val; render(); return; }
  save();
}

/* ---------- events ---------- */
document.addEventListener('click', e => {
  const t = e.target.closest('[data-act]'); if (!t || t.disabled) return;
  if (t.hasAttribute('data-confirm') && !t.dataset.armed) {
    e.preventDefault(); t.dataset.armed = '1'; const prev = t.innerHTML; t.innerHTML = t.dataset.confirm; t.classList.add('armed');
    setTimeout(() => { if (t.isConnected) { delete t.dataset.armed; t.innerHTML = prev; t.classList.remove('armed'); } }, 3000); return;
  }
  const fn = ACT[t.dataset.act]; if (fn) { if (t.tagName !== 'A') e.preventDefault(); fn(t, e); }
});
let saveT;
document.addEventListener('input', e => {
  const t = e.target;
  if (t.dataset.set) { const [i, j, f] = t.dataset.set.split(':'); const st = S.activeSession.exercises[+i].sets[+j]; st[f] = t.value; clearTimeout(saveT); saveT = setTimeout(save, 300); }
  else if (t.id === 'exsearch') document.getElementById('exlist').innerHTML = exListHtml(t.value);
});
document.addEventListener('change', e => { const t = e.target; if (t.dataset.edit) applyEdit(t.dataset.edit, t.value); });
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeSheet();
  if (e.key === 'Enter' && e.target.id === 'exsearch') ACT.addExName({ dataset: {} });
  if (e.key === 'Enter' && e.target.dataset.set) { const [i, j, f] = e.target.dataset.set.split(':'); if (f === 'reps' || f === 'duration') document.querySelector(`[data-act="check"][data-i="${i}"][data-j="${j}"]`)?.click(); else e.target.parentElement.querySelectorAll('input')[1]?.focus(); }
});
document.getElementById('importFile').addEventListener('change', async e => {
  const f = e.target.files[0]; e.target.value = ''; if (!f) return;
  try { const d = JSON.parse(await f.text()); if (!d || !Array.isArray(d.plans) || !Array.isArray(d.sessions)) throw 0;
    ui.pendingImport = d;
    openSheet(`<span class="eyebrow">Import backup</span><h2 class="serif" style="margin:6px 0 10px">${esc(f.name)}</h2><p class="note">${d.plans.length} plans and ${d.sessions.length} sessions. Merge keeps everything here and adds anything new. Replace swaps your data for this file.</p>
      <div class="stack" style="margin-top:14px"><button class="btn pri big" data-act="importDo" data-mode="merge">Merge</button><button class="btn danger" data-act="importDo" data-mode="replace" data-confirm="Tap again to replace everything">Replace</button></div>`);
  } catch (err) { toast('That file isn\'t a Ledger backup (needs plans and sessions).'); }
});
window.addEventListener('hashchange', route);
document.addEventListener('visibilitychange', () => { if (!document.hidden) { holdWake(); render(); } });
setInterval(() => {
  const a = S.activeSession; if (!a) return;
  const txt = clockStr(Date.now() - a.startedAt); document.querySelectorAll('[data-clock]').forEach(el => el.textContent = txt);
  if (a.restEnd) {
    const left = a.restEnd - Date.now();
    if (left <= 0) { a.restEnd = 0; save(); renderFloater(); if (!document.hidden) { beep(); buzz([200, 100, 200]); toast('Rest done · next set'); } }
    else { const el = document.getElementById('restt'); if (el) { el.textContent = clockStr(left + 999); const C = 2 * Math.PI * 18; document.getElementById('ringc')?.setAttribute('stroke-dashoffset', C * (1 - left / (a.restTotal * 1000))); } else renderFloater(); }
  }
}, 250);

/* ---------- boot ---------- */
S = load(); save();
route();
if (S.activeSession) holdWake();
try { if ('serviceWorker' in navigator && location.protocol === 'https:' && window.top === window.self) navigator.serviceWorker.register('sw.js').catch(() => {}); } catch (e) {}
</script>
</body>
</html>
